function appendValueRangePreview(rows) {
    if (!rows.length) return;
    const clean = rows.filter(r => r.value !== null && r.value !== undefined);
    const ambiguous = rows.filter(r => r.ambiguous_reason);
    modalValidateResult.appendChild(document.createElement("br"));
    if (clean.length) {
        const line = document.createElement("div");
        line.className = "editor-message";
        line.textContent = `Values found: ${clean.map(r => r.role ? `${r.value} (${r.role})` : r.value).join(", ")}`;
        modalValidateResult.appendChild(line);
    }
    if (ambiguous.length) {
        const warnLine = document.createElement("div");
        warnLine.className = "locator-status-warn";
        warnLine.textContent = (ambiguous.length === 1)
            ? `⚠ ${ambiguous[0].ambiguous_reason}`
            : `⚠ ${ambiguous.length} of ${rows.length} items have an ambiguous value - e.g. ${ambiguous[0].ambiguous_reason}`;
        modalValidateResult.appendChild(warnLine);
        // FIX 1 (item 3): list each ambiguous item's own candidates with
        // their role, so the right "Value to check" hint above is obvious
        // without guessing - Save stays enabled either way (never a
        // blocking dialog), matching this editor's existing convention of
        // amber warnings the user can act on or ignore.
        const detailLines = ambiguous.slice(0, 5).map((r, i) => {
            const cands = (r.candidates || []).map(c => `${c.raw} [${c.role}]`).join(", ");
            return `Item ${i + 1}: ${cands || "(no candidates)"}`;
        });
        const detailBlock = document.createElement("div");
        detailBlock.className = "editor-message";
        detailBlock.style.whiteSpace = "pre-line";
        detailBlock.textContent = detailLines.join("\n");
        modalValidateResult.appendChild(detailBlock);
    }
}

// Pick Element - an ADDITIONAL way to fill modalXpath, alongside typing
// it by hand; never replaces that path. Reuses the exact same session_
// path/insert_after_index the Validate button's own call above already
// sends, so the picker replays through the SAME preceding steps a
// Validate check (or a real Replay) would.
let modalPickElementPollTimer = null;

// A generation counter, bumped once per Pick Element click - the single
// source of truth for "which click's own async chain is still allowed
// to touch the modal". This is deliberately a CLIENT-side token, minted
// before the server's pick_id is even known, so it also covers the
// window BEFORE that: two rapid Pick Element clicks can have their own
// /start responses arrive out of order (the OLDER click's fetch
// resolving AFTER the newer one's), and without this, the older click's
// continuation would win and silently hijack pickId/polling right out
// from under the session the user actually just started. Clearing the
// interval alone (stopPickElementPolling) only stops FUTURE polls; it
// does nothing about a fetch() already in flight - that request still
// resolves on its own time and, without this check, its continuation
// would go right on filling in modalXpath/modalValidateResult with a
// STALE result from a click that's no longer the current one. Confirmed
// real: a screen recording showed the modal still reading "still open
// in the picker" well after that picker's own browser had actually
// closed.
let modalPickElementGeneration = 0;

function stopPickElementPolling() {
    if (modalPickElementPollTimer) {
        clearInterval(modalPickElementPollTimer);
        modalPickElementPollTimer = null;
    }
    modalPickElementBtn.disabled = false;
}

modalPickElementBtn.addEventListener("click", async () => {

    stopPickElementPolling();
    // mints THIS click's own generation token - any async continuation
    // (the /start fetch, or a poll) still holding an OLDER token checks
    // it against modalPickElementGeneration and discards itself instead
    // of touching the modal (see modalPickElementGeneration's own
    // comment above)
    const myGeneration = ++modalPickElementGeneration;

    // every Pick Element click starts completely fresh - the old xpath/
    // message/validated-state/candidate list from a PREVIOUS pick (or a
    // hand-typed value) must not linger while a new session is starting
    modalXpath.value = "";
    modalXpath.dispatchEvent(new Event("input"));
    modalXpathCandidates.innerHTML = "";
    modalXpathCandidates.hidden = true;

    modalPickElementBtn.disabled = true;
    modalValidateResult.className = "editor-message";
    modalValidateResult.textContent = "Opening a browser window - click an element there...";
    modalValidateResult.hidden = false;

    let pickId;
    try {
        const response = await fetch("/api/recordings/pick_element/start", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
                session_path: recordingPath,
                insert_after_index: (modalContext && modalContext.insertAfterIndex) ?? -1,
                warm_id: pickWarmId,
            }),
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Couldn't start the picker.");
        }

        // a NEWER click already happened while this /start call was in
        // flight - that newer click owns the modal now, this response
        // is stale and must not touch anything (not even disabling/
        // re-enabling the button, which belongs to whichever session is
        // actually still running)
        if (myGeneration !== modalPickElementGeneration) {
            return;
        }

        pickId = data.pick_id;

    } catch (error) {
        if (myGeneration !== modalPickElementGeneration) {
            return;
        }
        modalValidateResult.className = "locator-status-fail";
        modalValidateResult.textContent = "Pick Element failed: " + error.message;
        modalValidateResult.hidden = false;
        modalPickElementBtn.disabled = false;
        return;
    }

    modalValidateResult.textContent = "Waiting for you to click an element in the browser window...";

    // Shared by the "locked" (still open, may still change) and "done"
    // (browser closed - final) branches below - both fill in the SAME
    // xpath/match-count feedback from the SAME data shape; the only
    // difference is whether polling keeps going afterward and the note
    // shown alongside it, handled by the two call sites, not in here.
    function applyPickedProfile(data, noteSuffix) {
        // NO SILENT FALLBACK (drag-select): action_capture.js's own drag
        // handler sends this instead of ever guessing a single element
        // when the selection has no repeating group of >= 2 - the picker
        // stays open (nothing was locked on the JS side either) and the
        // CURRENT xpath field must be left exactly as it was, not
        // overwritten with an empty/wrong value, so returning here before
        // the unconditional modalXpath.value assignment below is
        // deliberate, not an oversight.
        if (data.locator_profile && data.locator_profile.mode === "multi_none") {
            modalValidateResult.className = "locator-status-fail";
            modalValidateResult.textContent =
                "No repeating items found in your selection. Draw the box over at least two similar items " +
                "(text is enough, you don't need to cover whole boxes)." + noteSuffix;
            modalValidateResult.hidden = false;
            return;
        }
        // FOLLOW-UP FIX (Part 4e): a fresh pick (click or drag) always
        // regenerates the step's name - captured here, at the one place
        // both the single-click and drag-select flows converge, from
        // whatever this pick's own locator_profile carries (see
        // action_capture.js's own _afqaComputeElementLabelInfo /
        // _afqaGenericGroupLabel for how it's built for each case).
        if (data.locator_profile && data.locator_profile.element_label) {
            lastPickedLabelInfo = {
                element_label: data.locator_profile.element_label,
                element_kind: data.locator_profile.element_kind || "element",
                element_section: data.locator_profile.element_section || "",
            };
        }
        modalXpath.value = data.xpath || "";
        // re-triggers the EXISTING modalXpath input listener above
        // (resets modalLocatorValidated/orphan-warning/save-enabled
        // state) - always auto-fills the field regardless of match_count
        // below, so a non-unique pick never blocks the user from seeing/
        // keeping what they clicked
        modalXpath.dispatchEvent(new Event("input"));

        // up to 3 candidates (see action_capture.js's buildXpathCandidates)
        // - the FIRST is xPath()'s own recommended pick, already the one
        // just filled into modalXpath above. Only worth showing a chooser
        // at all when there's a genuine second option; a single-candidate
        // pick (the common case) leaves this hidden entirely rather than
        // showing a radio group of one.
        const candidates = Array.isArray(data.xpath_candidates) ? data.xpath_candidates : [];
        // OPTIONAL - action_capture.js's own classifyXpathConfidence(),
        // one "stable"/"weak" tag per candidate in the same order.
        // Missing entirely (an older picker version, say) just means no
        // tag is shown - never blocks rendering the candidates themselves.
        const confidences = Array.isArray(data.locator_profile && data.locator_profile.xpath_candidates_confidence)
            ? data.locator_profile.xpath_candidates_confidence : [];
        modalXpathCandidates.innerHTML = "";
        if (candidates.length > 1) {
            const heading = document.createElement("div");
            heading.className = "editor-path";
            heading.textContent = "Candidates (recommended selected):";
            modalXpathCandidates.appendChild(heading);

            candidates.forEach((candidateXpath, idx) => {
                const row = document.createElement("label");
                row.style.display = "block";
                row.style.fontFamily = "monospace";
                row.style.fontSize = "12px";
                row.style.margin = "2px 0";

                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = "modalXpathCandidateChoice";
                radio.checked = (idx === 0);
                radio.addEventListener("change", () => {
                    modalXpath.value = candidateXpath;
                    modalXpath.dispatchEvent(new Event("input"));
                });

                const confidence = confidences[idx];
                const confidenceTag = confidence ? `  [${confidence}]` : "";

                row.appendChild(radio);
                row.appendChild(document.createTextNode(
                    " " + candidateXpath + (idx === 0 ? "  (recommended)" : "") + confidenceTag
                ));
                modalXpathCandidates.appendChild(row);
            });
            modalXpathCandidates.hidden = false;
        } else {
            modalXpathCandidates.hidden = true;
        }

        // LARGE-CONTAINER WARNING (optional field - see action_capture.js's
        // own pick-mode click handler): a picked element taller than the
        // viewport is almost always a wrapper, not the intended target -
        // still fills in the xpath/candidates above (the user may really
        // want it), just makes the steer-toward-something-smaller message
        // impossible to miss.
        if (data.locator_profile && data.locator_profile.large_container) {
            const warn = document.createElement("div");
            warn.className = "editor-error";
            warn.textContent = "⚠ " + (data.locator_profile.large_container_message || "You picked a large container, hover a smaller element");
            modalXpathCandidates.hidden = false;
            modalXpathCandidates.insertBefore(warn, modalXpathCandidates.firstChild);
        }

        // match-count feedback (Katalon Object Spy-style "Found: N of
        // N"), computed once by the picker itself at click time (see
        // action_capture.js's own pick-mode branch) - shown INSTEAD OF a
        // plain found/not-found message, not in addition to one, so this
        // deliberately does NOT also trigger the ordinary Validate
        // round-trip.
        const matchCount = data.match_count;
        // DRAG-SELECT (multi-pick): action_capture.js's own drag-select
        // handler tags its result { mode: "multi", in_box_count } on the
        // SAME locator_profile every pick already carries - a single
        // element pick (click, or drag-select's own no-group fallback)
        // never sets mode, so this only ever branches for a genuine
        // multi-pick result.
        const isMultiPick = !!(data.locator_profile && data.locator_profile.mode === "multi");
        if (isMultiPick) {
            const inBoxCount = data.locator_profile.in_box_count;
            // FOLLOW-UP FIX (Part A): action_capture.js's own drag-select
            // handler now scopes the built xpath down to EXACTLY the
            // selected items whenever it can verify that (position_scoped
            // true - see its own docstring) - matchCount and inBoxCount
            // are then the SAME number, so the message says so plainly
            // instead of the old "N on the page (M in your selection)"
            // wording, which only ever made sense when they could differ.
            // position_scoped false (a verified narrowing wasn't possible
            // for any candidate xpath) keeps the old wording AND the
            // fallback note explaining why, rather than silently keeping
            // quiet about matching more than was selected.
            const positionScoped = !!data.locator_profile.position_scoped;
            modalLocatorValidated = (typeof matchCount === "number" && matchCount >= 1);
            modalValidateResult.className = modalLocatorValidated
                ? (positionScoped ? "locator-status-ok" : "locator-status-warn")
                : "locator-status-fail";
            if (positionScoped) {
                modalValidateResult.textContent = `Found: ${matchCount} items (your selection)${noteSuffix}`;
            } else {
                modalValidateResult.textContent =
                    `Found: ${matchCount} matching elements on the page\n(${inBoxCount} inside your selection)${noteSuffix}`;
                if (data.locator_profile.scope_fallback_note) {
                    modalValidateResult.textContent += `\n${data.locator_profile.scope_fallback_note}`;
                }
            }
            // COUNT ELEMENTS VALIDATION (a): a fresh multi-pick with no
            // Expected Count yet is prefilled with the real match count -
            // done BEFORE the mismatch check below so a brand new pick
            // never immediately flags itself as "mismatched" against the
            // value it just set.
            if (modalActionType.value === "count_elements") {
                const expectedInput = document.getElementById("modalField_expected_count");
                if (expectedInput && expectedInput.value.trim() === "" && typeof matchCount === "number") {
                    expectedInput.value = matchCount;
                }
            }
        } else if (matchCount === 1) {
            modalValidateResult.className = "locator-status-ok";
            modalValidateResult.textContent = `Found: ${matchCount} of ${matchCount}${noteSuffix}`;
            modalLocatorValidated = true;
        } else if (typeof matchCount === "number" && matchCount >= 0) {
            modalValidateResult.className = "locator-status-fail";
            modalValidateResult.textContent =
                `Found ${matchCount} matches - this locator isn't unique, try picking a more specific element${noteSuffix}`;
            modalLocatorValidated = false;
        } else {
            modalValidateResult.className = "locator-status-fail";
            modalValidateResult.textContent = `Picked, but the match count couldn't be determined - Validate manually before saving.${noteSuffix}`;
            modalLocatorValidated = false;
        }
        // COUNT ELEMENTS VALIDATION (b, c): amber lines for a mismatch
        // against Expected Count, or an xpath that only matches one
        // element - appendCountElementsWarnings itself already no-ops
        // for every action type other than count_elements.
        appendCountElementsWarnings(matchCount);
        // DRAG-SELECT fallback note: action_capture.js's own drag-select
        // handler sets this when the selection contained no repeating
        // group of >= 2 - it already fell back to an ordinary single-
        // element pick (the message above is the normal "Found: N of N"
        // one), this just explains why a drag produced a single-element
        // result instead of a multi one.
        if (data.locator_profile && data.locator_profile.multi_pick_note) {
            const noteLine = document.createElement("div");
            noteLine.className = "editor-message";
            noteLine.textContent = "Note: " + data.locator_profile.multi_pick_note;
            modalValidateResult.appendChild(document.createElement("br"));
            modalValidateResult.appendChild(noteLine);
        }
        // FIX 3 (Validate Checkbox State dialog): only shown for that one
        // action type - checkbox_state_info (see recorder/pick_element.py's
        // _on_pick_result, which runs the SAME resolver a real replay uses)
        // is computed for every pick generically, but has nothing useful to
        // say for any other action type. Never blocks saving either way -
        // purely informational, appended after whatever match-count message
        // is already showing above.
        if (modalActionType.value === "validate_checked") {
            const cbInfo = data.checkbox_state_info;
            let cbNote = "";
            if (cbInfo && cbInfo.resolvedHow === "ambiguous") {
                cbNote = `⚠ ${cbInfo.ambiguousCount} checkboxes found near the picked element - pick a more specific one.`;
            } else if (cbInfo && cbInfo.state === "not_a_checkbox") {
                cbNote = `⚠ Picked element is a <${cbInfo.resolvedTag}>, not a checkbox, and no single associated checkbox was found nearby.`;
            } else if (cbInfo && ["label.control", "descendant", "ancestor"].includes(cbInfo.resolvedHow)) {
                const pickedTag = (data.tag || (data.locator_profile && data.locator_profile.tag) || "element");
                cbNote = `Note: picked <${pickedTag}>; state will be read from its associated checkbox <${cbInfo.resolvedTag}>.`;
            }
            if (cbNote) {
                const cbLine = document.createElement("div");
                cbLine.className = cbInfo.state === "not_a_checkbox" ? "locator-status-fail" : "editor-message";
                cbLine.textContent = cbNote;
                modalValidateResult.appendChild(document.createElement("br"));
                modalValidateResult.appendChild(cbLine);
            }
        }

        // BUG 2 fix (f): same preview as the Validate button handler,
        // shown immediately at pick time too (recorder/pick_element.py's
        // own value_range_preview, computed via the same resolver).
        if (modalActionType.value === "validate_value_range" && Array.isArray(data.value_range_preview)) {
            appendValueRangePreview(data.value_range_preview);
        }

        modalValidateResult.hidden = false;
        updateOrphanWarning();
        updateModalSaveEnabled();
    }

    modalPickElementPollTimer = setInterval(async () => {
        try {
            const response = await fetch(
                "/api/recordings/pick_element/status?pick_id=" + encodeURIComponent(pickId)
            );
            const data = await response.json();

            // STALE-RESULT GUARD: this specific fetch() was already in
            // flight (or this whole interval callback was already
            // scheduled) at the moment a NEWER Pick Element click made a
            // different session the active one. Discarding here, not
            // just relying on clearInterval, is what actually stops a
            // late-arriving response from an ALREADY-ENDED session from
            // overwriting the modal with stale data - confirmed real: a
            // screen recording showed the modal still reading "still
            // open in the picker" after that picker's own browser had
            // already closed.
            if (myGeneration !== modalPickElementGeneration) {
                return;
            }

            // LATENCY INSTRUMENTATION (always on - see pick_element.py/
            // app.py's matching [pick-timing] lines): every poll response
            // this modal receives is timestamped, so the full lock ->
            // Python -> server poll -> browser round trip can be
            // reconstructed end to end from the console + server logs
            // together.
            console.log('[pick-timing] ui_poll_received t=' + Date.now() + ' status=' + data.status);

            if (data.status === "waiting") {
                const mismatch = contentMismatchSuffix(data) || urlMismatchSuffix(data);
                if (mismatch) {
                    modalValidateResult.className = "editor-message";
                    modalValidateResult.textContent = "Waiting for you to click an element in the browser window..." + mismatch;
                    modalValidateResult.hidden = false;
                }
                return; // keep polling
            }

            if (data.status === "locked") {
                // NOT terminal - the picker browser is still open, and
                // the user can still double-click the highlighted
                // element there to release this pick and choose a
                // different one. Live-updates the SAME fields "done"
                // fills in, but keeps polling instead of stopping, so a
                // later release+re-pick (or the browser finally closing)
                // still gets picked up.
                applyPickedProfile(
                    data,
                    " - still open in the picker: double-click the highlighted element there to pick a different one, or close that browser window when you're happy with this pick." +
                        contentMismatchSuffix(data) + urlMismatchSuffix(data) + replayFailuresSuffix(data)
                );
                return; // keep polling
            }

            stopPickElementPolling();

            if (data.status === "done") {
                applyPickedProfile(data, contentMismatchSuffix(data) + urlMismatchSuffix(data) + replayFailuresSuffix(data));
            } else {
                // timeout / error / cancelled - reuse the existing
                // failure styling; typing the XPath manually, or trying
                // Pick Element again, both still work from here. A
                // confirmed content mismatch gets its own clearer
                // message here too - the generic "didn't complete"/
                // "browser closed" text would otherwise be the ONLY
                // thing shown when the walk stopped early for a real,
                // specific reason.
                modalValidateResult.className = "locator-status-fail";
                modalValidateResult.textContent =
                    (data.content_mismatch && contentMismatchSuffix(data).trim())
                    || ((data.message || "Pick Element didn't complete.") + replayFailuresSuffix(data));
                modalValidateResult.hidden = false;
            }

        } catch (error) {
            stopPickElementPolling();
            modalValidateResult.className = "locator-status-fail";
            modalValidateResult.textContent = "Pick Element failed: " + error.message;
            modalValidateResult.hidden = false;
        }
    }, 1000);
});

function openAddActionDialog(mode, index) {

    const actions = recordingData.actions;

    // "after Step N" where the very next recorded step is the tab_open that
    // Step N's own click caused: the page Step N actually LEADS to is that
    // new tab, so that's where the picker must land and where the new
    // action must run during replay (its page_id comes from the step it
    // follows). Inserting between the click and its tab_open would put the
    // action on the OLD tab, before the new one is adopted. Anchoring the
    // insertion after the tab_open makes the replayed prefix, the page
    // context and the insertion position all agree.
    let followsOpenedTab = false;
    if (
        mode === "after" &&
        actions[index] && actions[index].action_type !== "tab_open" &&
        actions[index + 1] && actions[index + 1].action_type === "tab_open"
    ) {
        followsOpenedTab = true;
        index = index + 1;
    }

    // page_url/page_id context: inherited from the step immediately
    // PRECEDING the insertion point (the page this new action will
    // actually land on during replay) - "after Step N" precedes on
    // Step N itself; "before Step N" precedes on Step N-1, i.e. the
    // step before the one being inserted before, not that step itself.
    // Falls back to the recording's own start_url/page 0 only when
    // there's truly no preceding step (inserting before Step 1, an
    // empty recording, or appending with none yet).
    const neighbor =
        mode === "before" ? (index > 0 ? actions[index - 1] : null) :
        mode === "after" ? actions[index] :
        mode === "edit" ? (index > 0 ? actions[index - 1] : null) :
        actions[actions.length - 1];

    // 0-based index, into the REAL session's own actions array, of the
    // step this new action is being inserted immediately after - -1
    // when there's truly no preceding step (inserting before Step 1, an
    // empty recording). Sent to validate_locator so it can replay
    // exactly those real, already-recorded steps before checking the
    // candidate xpath - same "preceding step" derivation pageUrl above
    // already uses, just expressed as the array index instead.
    const insertAfterIndex =
        mode === "before" ? index - 1 :
        mode === "after" ? index :
        mode === "edit" ? index - 1 :
        actions.length - 1;

    // a tab_close neighbor's OWN page_id names the tab it just closed, not
    // the one still open afterward - inheriting that directly would leave
    // a step landing on an already-closed page. Its remaining_page_id
    // (set for every tab_close, manual or recorded - see the manual-
    // tab_close branch in modalSaveBtn below and the recorder's own
    // _on_page_closed) is the tab actually still open once it's done.
    const neighborPageId =
        (neighbor && neighbor.action_type === "tab_close" && neighbor.remaining_page_id != null)
            ? neighbor.remaining_page_id
            : (neighbor && neighbor.page_id) || 0;

    modalContext = {
        mode,
        index: (mode === "before" || mode === "after" || mode === "edit") ? index : null,
        pageUrl: (neighbor && neighbor.page_url) || recordingData.start_url || "",
        pageId: neighborPageId,
        insertAfterIndex,
    };

    modalTitle.textContent =
        mode === "before" ? "Add Action Before Step " + (index + 1) :
        mode === "after" ? "Add Action After Step " + (index + 1) +
            (followsOpenedTab ? " (the new tab opened by Step " + index + ")" : "") :
        mode === "edit" ? "Edit Step " + (index + 1) :
        "Add Action";

    // ITEM 8: lets an ALREADY-RECORDED step's own locator/fields be
    // re-picked/edited in place, instead of Pick Element only ever
    // being reachable through "Add Action" (which always creates a
    // brand new step) - previously there was no way to work with an
    // existing action here at all short of deleting it and re-adding
    // it from scratch. mode === "edit" reuses this exact same modal -
    // same Pick Element button, same preceding-actions replay via
    // insertAfterIndex above (index - 1, so the picker lands exactly
    // where this step itself would run, same as "before" this step) -
    // pre-filled with the step's OWN current data; modalSaveBtn's own
    // handler (see its "edit" branch) updates that same index in place
    // rather than inserting a new step.
    if (mode === "edit") {
        const existing = actions[index] || {};
        populateActionTypeDropdown(existing.action_type);
        modalActionType.value = existing.action_type || "click";
        renderModalFields();
        const def = ACTION_FIELD_DEFS[modalActionType.value] || { locator: false, fields: [] };
        def.fields.forEach(field => {
            const input = document.getElementById("modalField_" + field.key);
            if (!input) {
                return;
            }
            let value = existing[field.key];
            // some recorded fields (the "check" action's own
            // expected_state, unlike every validate_*'s own
            // string-valued "checked"/"enabled"/"visible" options)
            // store a native true/false rather than one of this
            // field's own option strings - map it onto whichever
            // option this field actually offers instead of leaving
            // the <select> on its own default.
            if (typeof value === "boolean" && field.type === "select" && Array.isArray(field.options)) {
                const opt = field.options[value ? 0 : 1];
                value = opt ? opt[0] : value;
            }
            // SAFE HANDLING for a saved value no longer offered by this
            // field's own options (e.g. validate_visible's "hidden" -
            // removed from the dropdown, but a step saved with it before
            // that must still open correctly): without this, the <select>
            // would show no real selection at all, and Save - even
            // without the user touching this field - would silently
            // rewrite it to whichever option the browser falls back to
            // displaying. Adding the saved value back as its own option,
            // just for this edit, keeps it visible and exactly preserved
            // unless the user deliberately changes it. Generic (checked
            // for every select field, not just expected_state) and never
            // touches ACTION_FIELD_DEFS itself, so a fresh "Add Action"
            // still only ever offers the real, current choices.
            if (field.type === "select" && Array.isArray(field.options) &&
                value !== null && value !== undefined && value !== "" &&
                !field.options.some(([optValue]) => optValue === String(value))) {
                const extraOpt = document.createElement("option");
                extraOpt.value = String(value);
                extraOpt.textContent = String(value);
                input.appendChild(extraOpt);
            }
            input.value = (value === null || value === undefined) ? "" : value;
        });
        if (def.locator) {
            const lp = existing.locator_profile || {};
            // FOLLOW-UP FIX (Part 4e): editing an existing step WITHOUT a
            // fresh re-pick keeps its own already-saved element_label/
            // kind/section (renderModalFields(), called just above via
            // the action-type-change flow, already reset this to null -
            // restoring it here, AFTER that reset, for the edit-mode case
            // specifically is what makes "editing without re-picking
            // keeps [the name]" work; a fresh Pick Element click further
            // below overwrites this the normal way, same as any other
            // re-pick).
            if (lp.element_label) {
                lastPickedLabelInfo = {
                    element_label: lp.element_label,
                    element_kind: lp.element_kind || "element",
                    element_section: lp.element_section || "",
                };
            }
            modalXpath.value = lp.xpath || "";
            // dispatching "input" (so every other reactive bit of state -
            // orphan warning, candidate list, etc. - updates normally)
            // also resets modalLocatorValidated to false via that same
            // listener - immediately overridden right after, since this
            // xpath is the step's own EXISTING, already-working locator,
            // not an unverified guess the user just typed. Any further
            // actual edit to the field (typing, or a fresh Pick Element
            // pick) still correctly re-requires validation from there,
            // through that same existing "input" listener.
            modalXpath.dispatchEvent(new Event("input"));
            modalLocatorValidated = true;
            modalValidateResult.className = "locator-status-ok";
            modalValidateResult.textContent = "Using this step's existing locator - Validate again if you change it.";
            modalValidateResult.hidden = false;
            updateModalSaveEnabled();
        }
    } else {
        populateActionTypeDropdown();
        modalActionType.value = "click";
        renderModalFields();
    }

    addActionModal.hidden = false;

    // ITEM 1: the browser for Pick Element must only launch at the
    // moment the user actually clicks the "Pick Element" button - not
    // automatically when this modal opens. prewarmPickElement() used to
    // be called here to get a head start, but that meant a real headed
    // browser launched as a side effect of just opening Add Action,
    // before the user had looked at anything. Removed; the Pick Element
    // button's own click handler (modalPickElementBtn) is now the only
    // thing that ever starts a pick session/browser.
}

modalCancelBtn.addEventListener("click", () => {
    // CONFIRMED REAL BUG (found via a UI-level multi-cycle test that
    // drives the actual dashboard, not recorder.pick_element directly):
    // cancelling the modal while a Pick Element session was still
    // waiting/locked used to leave modalPickElementBtn permanently
    // disabled (see its own click handler - nothing but stopPickElement
    // Polling() ever re-enables it) and the poll interval still running
    // in the background, tied to a session the user just walked away
    // from. The NEXT Add Action open would then find Pick Element
    // stuck disabled until that abandoned session eventually timed out
    // server-side. Bumping the generation token here discards any
    // still-in-flight fetch/poll from that abandoned session (same
    // guard a brand new Pick Element click already relies on), and
    // stopPickElementPolling() clears the interval and re-enables the
    // button immediately, exactly as if that session had never
    // started.
    modalPickElementGeneration++;
    stopPickElementPolling();
    // closes that abandoned session's own picker browser right away
    // (see cancelPickElement's own comment) instead of leaving it open
    // until it times out on its own
    cancelPickElement();
    addActionModal.hidden = true;
    modalContext = null;
});

modalSaveBtn.addEventListener("click", () => {

    if (!modalContext) {
        return;
    }

    // COUNT ELEMENTS VALIDATION (d): never blocks saving outright - just
    // asks for a confirmation when the last known live match count
    // either mismatches Expected Count or is a single, non-repeating
    // element, using the exact same wording already shown inline (b, c).
    // Nothing to confirm (and no dialog at all) when neither applies, or
    // no pick/Validate has run yet this session (lastCountElementsMatchCount
    // still null - countElementsWarnings' own typeof check covers that).
    if (modalActionType.value === "count_elements") {
        const saveWarnings = countElementsWarnings(lastCountElementsMatchCount);
        if (saveWarnings.length && !confirm(saveWarnings.join("\n\n") + "\n\nSave anyway?")) {
            return;
        }
    }

    const actionType = modalActionType.value;
    const def = ACTION_FIELD_DEFS[actionType] || { locator: false, fields: [] };

    const newAction = {
        action_type: actionType,
        page_url: modalContext.pageUrl,
        page_id: modalContext.pageId,
        locator_profile: null,
        bounding_box: null,
        timestamp: new Date().toISOString(),
    };

    def.fields.forEach(field => {
        const input = document.getElementById("modalField_" + field.key);
        if (!input) {
            return;
        }
        let value = input.value;
        if (field.type === "number") {
            value = value.trim() === "" ? null : Number(value);
        } else {
            value = value.trim() === "" ? null : value;
        }
        newAction[field.key] = value;
    });

    if (def.locator) {
        const xpath = modalXpath.value.trim();
        newAction.locator_profile = xpath
            ? {
                css_path: null,
                xpath: xpath,
                // FOLLOW-UP FIX (Part 4c/4e): saved alongside the xpath
                // itself (not just held in the ephemeral modal-only
                // lastPickedLabelInfo) so a LATER edit of this step,
                // without a fresh re-pick, can still read its own
                // already-computed label/kind/section back - see
                // openAddActionDialog's own restoration of this on edit.
                // null when nothing was ever picked (a manually-typed
                // XPath) - buildAutoStepName falls back to the xpath's
                // own text()/normalize-space() predicate for that case.
                element_label: lastPickedLabelInfo ? lastPickedLabelInfo.element_label : null,
                element_kind: lastPickedLabelInfo ? lastPickedLabelInfo.element_kind : null,
                element_section: lastPickedLabelInfo ? lastPickedLabelInfo.element_section : null,
            }
            : null;
    }

    // a manually-added tab_open must never reuse an existing page_id -
    // see the replay-side page_id==0 guard this pairs with - so it gets
    // the next one never used anywhere in this recording, tagged
    // "manual": true (checked by the replay handler to open the tab
    // itself instead of waiting for a real popup that will never come),
    // and from_page_id (the tab it was opened alongside), the same shape
    // record_new_tab() already gives a REAL recorded tab_open. The name
    // is set explicitly (the same override deriveActionName/
    // _derive_action_name already respect for any user rename) so the
    // new tab's number is visible without touching either naming
    // function. Editing an ALREADY-EXISTING tab_open (real or manual)
    // reuses this same modal (see ITEM 8's own comment above) - only a
    // brand new insertion should ever get a freshly assigned page_id;
    // re-saving an existing one must leave page_id/manual/from_page_id
    // exactly as they already are, or every later step referencing that
    // page_id would silently break.
    if (actionType === "tab_open") {
        if (modalContext.mode === "edit") {
            const existingTabOpen = recordingData.actions[modalContext.index] || {};
            newAction.page_id = existingTabOpen.page_id;
            newAction.manual = existingTabOpen.manual;
            newAction.from_page_id = existingTabOpen.from_page_id;
        } else {
            const maxPageId = recordingData.actions.reduce(
                (m, a) => Math.max(m, Number(a.page_id) || 0), 0
            );
            newAction.page_id = maxPageId + 1;
            newAction.manual = true;
            newAction.from_page_id = modalContext.pageId;
            newAction.name = `Open Tab (tab ${newAction.page_id})` + (newAction.page_url ? ` - ${newAction.page_url}` : "");
        }
    }

    // mirrors the recorder's own _on_page_closed: the tab actually still
    // open after this close is whichever page the tab being closed was
    // opened FROM (its own tab_open's from_page_id) - found generically
    // by page_id, so this works whether that opener was a real recorded
    // tab_open or one manually added above. Falls back to page 0 (the
    // original page) when no matching opener is found, the same
    // "almost always where the user ends up" default the recorder uses.
    // Same edit-mode guard as tab_open above: re-saving an EXISTING
    // tab_close must not recompute this from scratch.
    if (actionType === "tab_close") {
        if (modalContext.mode === "edit") {
            newAction.remaining_page_id = (recordingData.actions[modalContext.index] || {}).remaining_page_id;
        } else {
            const opener = recordingData.actions.find(
                a => a.action_type === "tab_open" && a.page_id === newAction.page_id
            );
            newAction.remaining_page_id = (opener && opener.from_page_id != null) ? opener.from_page_id : 0;
        }
    }

    // FOLLOW-UP FIX 5/Part 4e: no manual "Step name / note" field - every
    // ADDED step gets a meaningful AUTO name, built from the action's own
    // data (buildAutoStepName's explicit patterns, or deriveActionName's
    // existing generic ones for any other action type) and SAVED onto
    // action.name so the editor/live log/dashboard/report all show it
    // (see _step_element_label in app.py).
    //
    // An ADDED step's name is regenerated FRESH on every save, from
    // whatever's currently in the modal - never frozen at whenever it was
    // first saved. This is also what "editing without re-picking keeps
    // it" naturally falls out of: the locator_profile itself only changes
    // via a fresh Pick Element click, so regenerating from the SAME
    // stored data reproduces the SAME name - EXCEPT when this task's own
    // richer buildAutoStepName can now extract more from that same data
    // than an older version of this code could (a manually-typed XPath's
    // own text() predicate, say), which is exactly "an old generic name
    // is regenerated ONLY if enough data is stored" from this task's own
    // spec. A field the user just edited (count_as, labels, ...) is
    // naturally reflected too, since it's the SAME newAction this just
    // built from those fields.
    //
    // A RECORDED step's own existing name (a previous save through this
    // same modal, or the separate per-row rename button elsewhere in this
    // file) still always wins, completely untouched - "recorded steps
    // display exactly as today."
    const isAddedStep = (
        modalContext.mode === "edit"
            ? (recordingData.actions[modalContext.index] || {}).origin === "added"
            : true
    );
    const existingStepName = (
        modalContext.mode === "edit"
            ? (recordingData.actions[modalContext.index] || {}).name
            : null
    ) || "";
    const autoStepName = buildAutoStepName(
        actionType, newAction,
        actionType === "count_elements" ? lastCountElementsMatchCount : null
    ) || deriveActionName(newAction);
    newAction.name = isAddedStep ? autoStepName : (existingStepName.trim() || autoStepName);

    // PHASE 3c: a genuinely NEW step (before/after/append) is "added";
    // editing an EXISTING step preserves whatever origin it already had
    // (a recorded step being edited is still, structurally, a recorded
    // step - only its data changed) - absent entirely (undefined) is
    // exactly "recorded" per this task's own backward-compatibility
    // rule (see renderActions()'s own badge logic and generate_script's
    // matching default).
    if (modalContext.mode === "edit") {
        const previousForOrigin = recordingData.actions[modalContext.index] || {};
        if (previousForOrigin.origin) {
            newAction.origin = previousForOrigin.origin;
        }
    } else {
        newAction.origin = "added";
        // who created this step: validations only ever come from the user
        // (the recorder never adds one on its own) - replay and the editor
        // use this marker to tell them apart from anything auto-created
        newAction.added_by = "user";
    }

    if (modalContext.mode === "before") {
        recordingData.actions.splice(modalContext.index, 0, newAction);
    } else if (modalContext.mode === "after") {
        recordingData.actions.splice(modalContext.index + 1, 0, newAction);
    } else if (modalContext.mode === "edit") {
        // ITEM 8: updates the EXISTING step in place instead of
        // inserting a new one.
        recordingData.actions[modalContext.index] = newAction;
    } else {
        recordingData.actions.push(newAction);
    }

    document.getElementById("recordingActionCount").textContent =
        recordingData.actions.length;

    // same fix as modalCancelBtn's own handler just above: Save can fire
    // while a Pick Element session is still only "locked" (its browser
    // still open, non-terminal) - e.g. the user picked something,
    // matchCount was 1, and they saved without bothering to close that
    // browser window first. Without this, the poll interval and the
    // disabled button would both linger into the NEXT Add Action open.
    modalPickElementGeneration++;
    stopPickElementPolling();
    // closes that still-open picker browser right away (see
    // cancelPickElement's own comment) instead of leaving it open until
    // it times out on its own
    cancelPickElement();

    addActionModal.hidden = true;
    modalContext = null;

    renderActions();
});

const addActionBtn =
    document.getElementById("addActionBtn");

if (addActionBtn) {

    addActionBtn.addEventListener(
        "click",
        () => openAddActionDialog("append", null)
    );

}


// ITEM 8: reflects how many deletions can currently be undone, and what
// the NEXT undo would restore - called after every push/pop of
// deletedActionsStack so the button's enabled state and tooltip never
// drift out of sync with what it would actually do if clicked
function updateUndoDeleteBtn() {
    const btn = document.getElementById("undoDeleteBtn");
    if (!btn) return;
    if (deletedActionsStack.length === 0) {
        btn.disabled = true;
        btn.title = "No deleted action to restore";
        return;
    }
    const top = deletedActionsStack[deletedActionsStack.length - 1];
    const label = (top.action && top.action.action_type) || "action";
    btn.disabled = false;
    btn.title = `Restore the last deleted action (${label}, was step ${top.index + 1})`
        + (deletedActionsStack.length > 1
            ? ` - ${deletedActionsStack.length} deletions available to undo`
            : "");
}

const undoDeleteBtn =
    document.getElementById("undoDeleteBtn");

if (undoDeleteBtn) {

    undoDeleteBtn.addEventListener(
        "click",
        () => {
            if (deletedActionsStack.length === 0) return;

            // LIFO: the most recently deleted action comes back first -
            // if the user deleted three actions in a row, three clicks
            // of Undo restore them in reverse order, each landing back
            // at its own original index (clamped to the current, now-
            // shorter array length in case something else shifted it)
            const { index, action } = deletedActionsStack.pop();
            const restoreAt = Math.min(
                index,
                recordingData.actions.length
            );
            recordingData.actions.splice(restoreAt, 0, action);

            document.getElementById(
                "recordingActionCount"
            ).textContent =
                recordingData.actions.length;

            updateUndoDeleteBtn();
            renderActions();
        }
    );

}


const saveEditedBtn =
    document.getElementById("saveEditedBtn");

const saveStatus =
    document.getElementById("saveStatus");

if (saveEditedBtn) {

    saveEditedBtn.addEventListener(
        "click",
        async () => {

            saveStatus.hidden =
                true;

            saveEditedBtn.disabled =
                true;

            try {

                const response =
                    await fetch(
                        "/api/recordings/save",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    {
                                        recording: recordingData
                                    }
                                )
                        }
                    );


                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                if (
                    !contentType.includes(
                        "application/json"
                    )
                ) {

                    throw new Error(
                        "Server returned HTML instead of JSON."
                    );
                }


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Failed to save edited recording."
                    );
                }


                saveStatus.className =
                    "editor-message";

                saveStatus.textContent =
                    "Saved as " +
                    data.name +
                    " (" +
                    data.path +
                    ")";

                saveStatus.hidden =
                    false;

            }

            catch (error) {

                console.error(
                    "Save failed:",
                    error
                );

                saveStatus.className =
                    "editor-error";

                saveStatus.textContent =
                    "Save failed: " +
                    error.message;

                saveStatus.hidden =
                    false;

            }

            finally {

                saveEditedBtn.disabled =
                    false;
            }
        }
    );

}


loadRecording();

</script>
