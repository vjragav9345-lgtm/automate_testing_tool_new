<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>JSON Recording Editor - AutoFlow QA</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}?v=25"
    />

</head>


<body>

<header class="app-header">

    <h1>
        JSON Recording Editor
    </h1>

    <p class="tagline">
        View and edit recorded browser actions
    </p>

</header>


<main class="editor-container">

    <!-- RECORDING INFORMATION -->
    <section class="editor-header">

        <div>

            <h2>
                Recording Details
            </h2>

            <!-- PHASE 2c: shown only when this recording has a
                 display_name - hidden by default; renderRecording()
                 shows it only when recordingData.display_name is set, so
                 a recording that's never been named looks exactly as it
                 does today (just "Selected Recording: <path>" below). -->
            <h1 id="recordingDisplayNameHeading" class="recording-display-name" hidden></h1>

            <p class="editor-path">

                Selected Recording:

                <strong id="selectedRecordingPath">
                    {{ recording_path }}
                </strong>

                <button
                    type="button"
                    id="recordingRenameBtn"
                    class="secondary-btn"
                    style="margin-left: 8px; padding: 2px 10px; font-size: 12px;"
                >
                    Rename
                </button>

            </p>

        </div>


        <button
            type="button"
            class="secondary-btn"
            onclick="window.location.href='/'"
        >
            Close
        </button>

    </section>


    <!-- LOADING -->
    <section
        id="editorLoading"
        class="editor-message"
    >
        Loading recording...
    </section>


    <!-- ERROR -->
    <section
        id="editorError"
        class="editor-error"
        hidden
    ></section>


    <!-- RECORDING DETAILS -->
    <section
        id="recordingInfo"
        class="recording-info"
        hidden
    >

        <div class="info-card">

            <span class="info-label">
                Name
            </span>

            <span
                id="recordingName"
                class="info-value"
            >
                -
            </span>

        </div>


        <div class="info-card">

            <span class="info-label">
                Total Actions
            </span>

            <span
                id="recordingActionCount"
                class="info-value"
            >
                0
            </span>

        </div>


        <div class="info-card">

            <span class="info-label">
                Start URL
            </span>

            <span
                id="recordingStartUrl"
                class="info-value"
            >
                -
            </span>

        </div>


        <div class="info-card">

            <span class="info-label">
                Recorded At
            </span>

            <span
                id="recordingRecordedAt"
                class="info-value"
            >
                -
            </span>

        </div>


        <div class="info-card">

            <span class="info-label">
                Saved At
            </span>

            <span
                id="recordingSavedAt"
                class="info-value"
            >
                -
            </span>

        </div>


        <div class="info-card">

            <span class="info-label">
                Stop Reason
            </span>

            <span
                id="recordingStopReason"
                class="info-value"
            >
                -
            </span>

        </div>

    </section>


    <!-- ACTIONS: latest edited (left) + original for comparison (right,
         only present when this recording IS an edited version of one) -->
    <div class="editor-columns">

        <section
            id="actionsContainer"
            class="actions-editor editor-column"
            hidden
        >

            <h2>
                Recorded Actions
            </h2>

            <div id="actionsList"></div>

            <button
                type="button"
                id="addActionBtn"
                class="secondary-btn"
            >
                Add Action
            </button>

            <button
                type="button"
                id="undoDeleteBtn"
                class="secondary-btn"
                title="No deleted action to restore"
                disabled
            >
                Undo Delete
            </button>


            <div
                id="saveStatus"
                class="editor-message"
                hidden
            ></div>

            <button
                type="button"
                id="saveEditedBtn"
                class="action-btn"
            >
                Save Edited JSON
            </button>

        </section>


        <!-- ADD ACTION DIALOG - guided, per-type field entry + live
             locator validation against the real page. Save here only
             updates the in-memory recordingData.actions array; the
             page-level "Save Edited JSON" button above (unchanged) is
             still the only thing that persists to disk. -->
        <div
            id="addActionModal"
            class="modal-overlay"
            hidden
        >
            <div class="modal-dialog">

                <h3 id="modalTitle">Add Action</h3>

                <label>Action Type</label>
                <select id="modalActionType" class="editor-input"></select>

                <p id="modalActionDescription" class="modal-helper-text"></p>

                <div id="modalFields"></div>

                <div id="modalTestNavigateSection" hidden>
                    <button type="button" id="modalTestNavigateBtn" class="secondary-btn">
                        Test Navigate
                    </button>
                    <div id="modalTestNavigateResult" class="editor-message" hidden></div>
                </div>

                <div id="modalLocatorSection" hidden>

                    <label>XPath</label>
                    <input id="modalXpath" type="text" class="editor-input" placeholder="e.g. //button[text()='Submit']">

                    <button type="button" id="modalValidateBtn" class="secondary-btn">
                        Validate
                    </button>

                    <button type="button" id="modalPickElementBtn" class="secondary-btn" title="Click an element in a live browser window to fill this field automatically">
                        🎯 Pick Element
                    </button>

                    <div id="modalValidateResult" class="editor-message" hidden></div>

                    <div id="modalXpathCandidates" hidden></div>

                    <div id="modalOrphanWarning" class="modal-orphan-warning" hidden>
                        <span id="modalOrphanWarningText"></span>
                        <button type="button" id="modalOrphanWarningDismiss" class="modal-orphan-dismiss" aria-label="Dismiss warning">&times;</button>
                    </div>

                </div>

                <div class="modal-buttons">

                    <button type="button" id="modalCancelBtn" class="secondary-btn">
                        Cancel
                    </button>

                    <button type="button" id="modalSaveBtn" class="action-btn">
                        Save
                    </button>

                </div>

            </div>
        </div>

        <!-- FOLLOW-UP FIX 3: replaces the native prompt() this button used
             to use - same modal-overlay/modal-dialog/modal-buttons style
             as the Add Action dialog above. -->
        <div id="renameRecordingModal" class="modal-overlay" hidden>
            <div class="modal-dialog">

                <h3>Rename this test</h3>

                <label for="renameRecordingInput">Test name</label>
                <input id="renameRecordingInput" type="text" class="editor-input">

                <div id="renameRecordingError" class="editor-error" hidden></div>

                <div class="modal-buttons">
                    <button type="button" id="renameRecordingCancelBtn" class="secondary-btn">Cancel</button>
                    <button type="button" id="renameRecordingSaveBtn" class="action-btn">Save</button>
                </div>

            </div>
        </div>

    </div>


</main>


<script>

const recordingPath = {{ recording_path | tojson }};

let recordingData = null;

// ITEM 8: undo stack for deleted actions - {index, action} pushed on
// every delete (most recent last), popped/restored in reverse (LIFO)
// order on Undo. Deliberately module-level (not per-row) since "undo"
// restores whatever was MOST recently deleted regardless of which row's
// delete button removed it - a single button covers every row. Scope:
// undo restores deletions made in THIS editing session, back through
// however many were made in a row (not just the last one) - it does not
// persist across a page reload, matching how the rest of this editor's
// unsaved edits already work (recordingData itself is in-memory only
// until Save Changes is clicked).
let deletedActionsStack = [];

// per-step locator health from the most recent Replay of this recording,
// keyed by step index (1-based, matching report.json's own step.index -
// see script_generator.py's `for i, step in enumerate(STEPS, start=1)`,
// so action array position N maps to key N+1). Populated best-effort by
// loadLastReplayHealth() below; stays an empty Map (every badge simply
// omitted) if this recording has never been replayed yet, or the lookup
// fails for any reason - this is purely an enhancement over the base
// editor view, never something its core load path depends on.
let lastReplayStepsByIndex = new Map();

// recorded page content (element text, attribute values, xpaths, ...)
// can contain arbitrary characters - anything built as an innerHTML
// string from it (see the locator-health detail block below) is escaped
// through this first, rather than trusting it's safe to interpolate raw
function _escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

// guards against ever rendering the editor/action list more than once on
// this page - loadRecording() is only ever called a single time below,
// but this makes that a hard guarantee rather than an assumption
let _recordingLoadStarted = false;


async function loadRecording() {

    if (_recordingLoadStarted) {
        return;
    }

    _recordingLoadStarted = true;

    const loading =
        document.getElementById("editorLoading");

    const error =
        document.getElementById("editorError");

    const info =
        document.getElementById("recordingInfo");

    const actionsContainer =
        document.getElementById("actionsContainer");

    try {

        loading.hidden = false;
        error.hidden = true;
        info.hidden = true;
        actionsContainer.hidden = true;


        const url =
            "/api/recordings/view?path=" +
            encodeURIComponent(recordingPath);


        const response =
            await fetch(url, {
                headers: {
                    "Accept": "application/json"
                }
            });


        /*
         * IMPORTANT:
         * Do not directly call response.json().
         * First check whether Flask actually returned JSON.
         * This prevents the:
         *
         * Unexpected token '<'
         *
         * error.
         */

        const contentType =
            response.headers.get("content-type") || "";


        if (!contentType.includes("application/json")) {

            const text =
                await response.text();

            throw new Error(
                "Server returned HTML instead of JSON."
            );
        }


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load recording."
            );
        }


        recordingData =
            data.recording;


        renderRecording();


        loading.hidden = true;
        info.hidden = false;
        actionsContainer.hidden = false;

        // fire-and-forget - never blocks or fails the main editor load;
        // re-renders the (already-visible) action list once it resolves
        // so badges simply appear a moment later rather than holding up
        // the page
        loadLastReplayHealth();

    }

    catch (err) {

        console.error(
            "Recording load failed:",
            err
        );

        loading.hidden = true;

        error.textContent =
            "Failed to load recording: " +
            err.message;

        error.hidden = false;
    }
}


/* =========================================================
   LOCATOR HEALTH - reuses the last Replay's per-step locator_report
   (see _describe_locator_resolution in generator/script_generator.py,
   and the read-only /api/recordings/last_result route already used by
   the Dashboard's own "View Last Log" button) to show each step's
   locator health right in the editor, instead of a second locator-
   analysis pass over the recording. No new storage, no new replay -
   this is exactly the data a Replay already produced, just surfaced
   here too.
========================================================= */

async function loadLastReplayHealth() {

    try {

        const url =
            "/api/recordings/last_result?path=" +
            encodeURIComponent(recordingPath);

        const response = await fetch(url, {
            headers: { "Accept": "application/json" }
        });

        const contentType = response.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
            return;
        }

        const data = await response.json();

        if (!response.ok || !data.success || !data.found || !Array.isArray(data.steps)) {
            return;
        }

        lastReplayStepsByIndex = new Map(
            data.steps.map(step => [step.index, step])
        );

        renderActions();

    } catch (err) {
        // best-effort only - the editor's core view already rendered
        // fine without this; a failed health lookup just means no
        // badges show up, never an error the user has to deal with
        console.error("locator health lookup failed:", err);
    }
}

// four-tier health classification over a step's locator_report (see
// _LOCATOR_STRATEGY_INFO in script_generator.py for the full strategy
// list this reads from) - deliberately the ONLY place that maps a
// strategy/resolved/weak combination to a color tier, so the badge and
// the expanded detail panel below can never disagree with each other
const LOCATOR_HEALTH_TIERS = {
    unresolved: { icon: "🔴", label: "Locator unresolved" },
    weak: { icon: "🟠", label: "Weak locator" },
    fallback: { icon: "🟡", label: "Fallback locator used" },
    stable: { icon: "🟢", label: "Stable locator" },
};

function classifyLocatorHealth(locatorReport) {

    if (!locatorReport) {
        return null;
    }

    if (!locatorReport.resolved) {
        return "unresolved";
    }

    if (locatorReport.weak) {
        return "weak";
    }

    // text/content match (text+tag) and pure structural DOM-path matches
    // (css_path, xpath) are all "a real attribute-based signal wasn't
    // available" tiers - still deterministic single-element matches,
    // just not as durable across markup changes as an id/aria-label/
    // role - so all three read as "fallback used", not "stable"
    if (["text+tag", "css_path", "xpath"].includes(locatorReport.strategy)) {
        return "fallback";
    }

    return "stable";
}


function renderRecording() {

    if (!recordingData) {
        return;
    }


    document.getElementById(
        "recordingName"
    ).textContent =
        recordingData.name || "-";


    document.getElementById(
        "recordingActionCount"
    ).textContent =
        Array.isArray(recordingData.actions)
            ? recordingData.actions.length
            : 0;


    document.getElementById(
        "recordingStartUrl"
    ).textContent =
        recordingData.start_url || "-";


    document.getElementById(
        "recordingRecordedAt"
    ).textContent =
        recordingData.recorded_at || "-";


    document.getElementById(
        "recordingSavedAt"
    ).textContent =
        recordingData.saved_at || "-";


    document.getElementById(
        "recordingStopReason"
    ).textContent =
        recordingData.stop_reason || "-";


    // PHASE 2c: absent/empty on any recording saved before display_name
    // existed, or one nobody has named yet - the heading stays hidden
    // and everything else here is completely unaffected either way.
    const displayNameHeading = document.getElementById("recordingDisplayNameHeading");
    const hasDisplayName = typeof recordingData.display_name === "string" && recordingData.display_name.trim();
    displayNameHeading.hidden = !hasDisplayName;
    displayNameHeading.textContent = hasDisplayName ? recordingData.display_name : "";

    renderActions();
}

// FOLLOW-UP FIX 3: in-page modal replacing the native prompt()/alert()
// this Rename button used to use - same open/save/cancel shape as the
// dashboard's own nameTestModal (see static/js/script.js), just scoped to
// this page's own recordingData/recordingPath instead of a dashboard card.
const renameRecordingBtn = document.getElementById("recordingRenameBtn");
const renameRecordingModal = document.getElementById("renameRecordingModal");
const renameRecordingInput = document.getElementById("renameRecordingInput");
const renameRecordingError = document.getElementById("renameRecordingError");
const renameRecordingCancelBtn = document.getElementById("renameRecordingCancelBtn");
const renameRecordingSaveBtn = document.getElementById("renameRecordingSaveBtn");

function openRenameRecordingModal() {
    if (!recordingData || !renameRecordingModal) return;
    renameRecordingInput.value = (typeof recordingData.display_name === "string" && recordingData.display_name) || "";
    renameRecordingError.hidden = true;
    renameRecordingModal.hidden = false;
    renameRecordingInput.focus();
}

function closeRenameRecordingModal() {
    if (!renameRecordingModal) return;
    renameRecordingModal.hidden = true;
}

async function saveRenameRecording() {
    const next = renameRecordingInput.value;
    renameRecordingSaveBtn.disabled = true;
    try {
        const response = await fetch("/api/recordings/set_display_name", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ path: recordingPath, display_name: next }),
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
            throw new Error(data.message || "Couldn't save the name.");
        }
        recordingData.display_name = data.display_name;
        renderRecording();
        closeRenameRecordingModal();
    } catch (error) {
        renameRecordingError.textContent = "Rename failed: " + error.message;
        renameRecordingError.hidden = false;
    } finally {
        renameRecordingSaveBtn.disabled = false;
    }
}

if (renameRecordingBtn) {
    renameRecordingBtn.addEventListener("click", openRenameRecordingModal);
}
if (renameRecordingCancelBtn) {
    renameRecordingCancelBtn.addEventListener("click", closeRenameRecordingModal);
}
if (renameRecordingSaveBtn) {
    renameRecordingSaveBtn.addEventListener("click", saveRenameRecording);
}
if (renameRecordingInput) {
    renameRecordingInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") saveRenameRecording();
        else if (e.key === "Escape") closeRenameRecordingModal();
    });
}


/* =========================================================
   ACTION TYPE LABELS / FIELD DEFINITIONS - drives both the compact
   list's type label and the Add Action dialog's dropdown + per-type
   field set. Field keys match exactly what generate_script() in
   generator/script_generator.py reads off each action dict (see
   generate_script's own STEPS-building loop) - never invented names.
========================================================= */

// Labels are deliberately unambiguous about WHETHER an action type
// interacts with the page (clicks/sets something) or only reads/
// asserts its current state - this is what this session's actual
// mistake (check vs check_checked) came down to. Every read-only/
// assertion type (the same set ACTION_FIELD_DEFS below marks
// `readOnly: true`) gets a "(Read-Only)" suffix; every action that
// genuinely mutates the page states what it sets, e.g. "(Set State)".
const ACTION_TYPE_LABELS = {
    click: "Click",
    dblclick: "Double Click",
    right_click: "Right Click",
    fill: "Fill",
    select: "Select",
    submit: "Submit",
    press: "Key Press",
    scroll: "Scroll",
    navigate: "Navigate",
    tab_open: "Open Tab",
    tab_switch: "Switch Tab",
    tab_close: "Close Tab",
    validate: "Assert Text Visible (Read-Only)",
    click_if_exists: "Click If Exists",
    screenshot: "Screenshot",
    check: "Click Checkbox (Set State)",
    check_checked: "Verify Checkbox State (Read-Only)",
    capture_value: "Capture Value",
    compare_value: "Compare Value (Read-Only)",
    validate_element: "Validate Element State (Read-Only)",
    validate_text: "Validate Text (Read-Only)",
    validate_attribute: "Validate Attribute (Read-Only)",
    validate_visible: "Validate Visible (Read-Only)",
    validate_url: "Validate URL (Read-Only)",
    validate_value: "Validate Value (Read-Only)",
    validate_enabled: "Validate Enabled (Read-Only)",
    count_elements: "Count Elements",
    compare_counts: "Compare Counts (Read-Only)",
    count_summary: "Count Summary (Read-Only)",
    detect_duplicates: "Detect Duplicates (Read-Only)",
    capture_list: "Capture List",
    compare_list_overlap: "Compare List Overlap (Read-Only)",
    validate_value_range: "Validate Value Range (Read-Only)",
    // ITEM 7 FIX: validate_checked was wired into replay/ACTION_FIELD_DEFS
    // (readOnly: true there, so it gets the same "(Read-Only)" suffix
    // convention this map's own top comment describes) but was never
    // added here, or to the other two ACTION_TYPE_LABELS copies this
    // codebase keeps (templates/live_log.html, static/js/script.js).
    validate_checked: "Validate Checkbox State (Read-Only)",
};

// Best-effort, DATA-ONLY readable name for a step - mirrors
// generator/script_generator.py's own _derive_action_name() (same
// fields, same shape of output), kept as a separate JS copy since the
// editor renders steps client-side with no per-step server round trip.
// action.name (an explicit, human-typed rename - see the rename button
// in renderActions() below) always wins; this is only the fallback,
// computed fresh every render, NEVER written back into recordingData
// unless the user explicitly renames - an old recording opened here
// gets readable names "for free" without the file ever being touched.
function urlPathLabel(url) {
    try {
        const path = new URL(url, window.location.href).pathname.replace(/^\/|\/$/g, "");
        if (!path) return "Home page";
        const segment = path.split("/").pop().replace(/[-_]/g, " ").replace(/\.html$/, "");
        const words = segment.split(" ").filter(Boolean);
        return words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ") || "page";
    } catch (e) {
        return "page";
    }
}

function deriveActionName(action) {
    if (typeof action.name === "string" && action.name.trim()) {
        return action.name.trim();
    }
    const actionType = action.action_type;
    const lp = action.locator_profile || {};
    const value = action.value;

    let label = (
        (lp.text || "").split("\n")[0].trim() ||
        (lp.accessible_name || "").trim() ||
        (lp.aria_label || "").trim() ||
        (lp.placeholder || "").trim() ||
        (lp.title || "").trim() ||
        (lp.inner_label || "").trim() ||
        (lp.near_text || "").trim() ||
        (lp.name || "").trim()
    );
    label = label.slice(0, 40);
    const tag = (lp.tag || "").toLowerCase();
    const role = (lp.role || "").toLowerCase();

    function roleWord() {
        if (role) return role;
        if (tag === "a") return "link";
        if (tag === "button") return "button";
        if (tag === "input" || tag === "textarea") return "field";
        if (tag === "select") return "dropdown";
        return "element";
    }

    if (["click", "dblclick", "right_click", "submit"].includes(actionType)) {
        const verb = { dblclick: "double-click", right_click: "right-click", submit: "submit" }[actionType];
        const base = label ? `"${label}" ${roleWord()}` : `${tag === "a" ? "link" : (tag === "button" ? "button" : "element")} (no visible text)`;
        return verb ? `${verb} ${base}` : base;
    }
    if (actionType === "fill") {
        return `${label || "field"}: "${value == null ? "" : value}"`;
    }
    if (actionType === "select") {
        return `${label || "dropdown"}: "${value == null ? "" : value}"`;
    }
    if (actionType === "press") {
        return `Press "${value || "key"}"` + (label ? ` in ${label}` : "");
    }
    if (actionType === "check") {
        const expectedState = action.expected_state;
        const stateWord = (expectedState === false || expectedState === "false" || expectedState === 0) ? "unchecked" : "checked";
        return `"${label || "checkbox"}" checkbox (${stateWord})`;
    }
    if (actionType === "scroll") {
        const deltaY = action.delta_y || 0;
        const direction = deltaY >= 0 ? "down" : "up";
        return `${direction} ${Math.abs(deltaY)}px on ${urlPathLabel(action.page_url)}`;
    }
    if (actionType === "navigate") {
        return `${urlPathLabel(action.page_url)} page`;
    }
    if (actionType && actionType.startsWith("validate")) {
        return label ? `validate "${label}"` : "validate";
    }
    return label ? `"${label}" (${tag || actionType})` : (tag || actionType || "step");
}

// PHASE 3a: auto-naming for a step ADDED (or edited) through this modal -
// deriveActionName() above stays completely untouched and keeps naming
// RECORDED steps exactly as it always has (see this function's own
// docstring); this is a SEPARATE, explicit .name the modal writes onto
// newAction at save time (see modalSaveBtn's own use of it), the same
// "an explicit action.name always wins" mechanism deriveActionName's own
// comment already documents.
//
// same volatile-number policy as generator/script_generator.py's
// _strip_volatile_numbers / action_capture.js's _afqaStripVolatileNumbers -
// kept in sync if that policy ever changes.
function _stripVolatileNumbersForStepName(text) {
    if (!text) return text;
    var out = text.replace(/[\(\[]\s*\d[\d,.]*\s*[kKmM]?\s*[\)\]]/g, ' ');
    out = out.replace(/(?<!\w)(?:\d[\d,.]*[kKmM]|\d+(?:[.,]\d+)+)(?!\w)/g, ' ');
    return out.replace(/\s+/g, ' ').trim();
}

// FOLLOW-UP FIX (Part 4b): label/kind/section for the CURRENT step's own
// target - from a real pick (element_label/element_kind/element_section,
// saved onto locator_profile at Save time - see action_capture.js's own
// _afqaComputeElementLabelInfo for how those are built), or, for a
// manually-typed XPath with no pick at all, extracted from the xpath
// text itself: its own text()/normalize-space() predicate, then
// @aria-label/@title/@placeholder, then the tag name - exactly the
// cascade this task's own spec calls for.
function _getStepLabelInfo(lp) {
    lp = lp || {};
    if (lp.element_label) {
        return {
            label: _stripVolatileNumbersForStepName(String(lp.element_label)).slice(0, 40),
            kind: lp.element_kind || "element",
            section: (lp.element_section || "").slice(0, 25),
        };
    }
    const xpath = lp.xpath || "";
    let label = "";
    let m = xpath.match(/normalize-space\(\s*(?:text\(\)|\.)\s*\)\s*=\s*['"]([^'"]+)['"]/)
        || xpath.match(/\btext\(\)\s*=\s*['"]([^'"]+)['"]/)
        || xpath.match(/contains\(\s*(?:normalize-space\(\s*)?(?:text\(\)|\.)\s*\)?\s*,\s*['"]([^'"]+)['"]\s*\)/);
    if (m) label = m[1];
    if (!label) {
        m = xpath.match(/@aria-label\s*=\s*['"]([^'"]+)['"]/)
            || xpath.match(/@title\s*=\s*['"]([^'"]+)['"]/)
            || xpath.match(/@placeholder\s*=\s*['"]([^'"]+)['"]/);
        if (m) label = m[1];
    }
    let tag = "";
    const segs = xpath.split("/").filter(Boolean);
    if (segs.length) {
        const tm = segs[segs.length - 1].match(/^([a-zA-Z][a-zA-Z0-9]*)/);
        tag = tm ? tm[1].toLowerCase() : "";
    }
    if (!label) label = tag;
    label = _stripVolatileNumbersForStepName(label).slice(0, 40);
    return { label: label, kind: "element", section: "" };
}

// same "(Read-Only)" convention actionTypeLabel's own map uses elsewhere
// in this file - not meaningful as part of a step's own auto-generated
// NAME (a sentence, not a type tag), so stripped only for that use.
function _readableActionTypeForName(actionType) {
    return actionTypeLabel(actionType).replace(/\s*\(Read-Only\)\s*$/, "");
}

// FOLLOW-UP FIX (Part 4b): explicit, human-wording patterns for the
// action types this task names - verb once, built entirely from the
// action's OWN data (label/kind/section above, plus its own typed
// fields), never hardcoded site text. Any OTHER action type falls
// through to the "<Readable action type> '<label>'" catch-all this
// task's own spec calls for, or (with no label at all) to
// deriveActionName()'s existing generic naming - returns null only when
// NEITHER applies, so a truly label-less step still gets a real name.
function buildAutoStepName(actionType, newAction, liveMatchCount) {
    const info = _getStepLabelInfo(newAction.locator_profile);
    const label = info.label;
    const kind = info.kind;
    const sectionSuffix = info.section ? ` (${info.section})` : "";

    if (actionType === "click") {
        if (kind === "radio") return label ? `Select '${label}' option${sectionSuffix}` : "Select radio option";
        if (kind === "checkbox") return label ? `Tick '${label}' checkbox${sectionSuffix}` : "Tick checkbox";
        if (kind === "link") return label ? `Click '${label}' link` : "Click link";
        if (kind === "button") return label ? `Click '${label}' button` : "Click button";
        return label ? `Click '${label}'` : `Click ${kind}`;
    }
    // FOLLOW-UP FIX (Part 4b): the "check" action type (toggles a
    // checkbox/radio to a specific state - see ACTION_FIELD_DEFS'
    // "expected_state" field) is the SAME conceptual "tick a checkbox"
    // this task's own Click+checkbox pattern already names - just a
    // separate action TYPE from a plain click, not a separate wording.
    if (actionType === "check") {
        return label ? `Tick '${label}' checkbox${sectionSuffix}` : "Tick checkbox";
    }
    if (actionType === "fill") {
        const value = newAction.value == null ? "" : newAction.value;
        return label ? `Type '${value}' in '${label}' box` : `Type '${value}'`;
    }
    if (actionType === "validate_text") {
        return `Check text '${newAction.value || ""}' in ${label || kind}`;
    }
    if (actionType === "validate_visible") {
        return label ? `Check '${label}' ${kind} is visible` : `Check ${kind} is visible`;
    }
    if (actionType === "count_elements") {
        const count = (typeof liveMatchCount === "number") ? liveMatchCount : "?";
        const storeLabel = (newAction.count_as || "").trim();
        return `Count ${label || kind} (${count})` + (storeLabel ? ` -> ${storeLabel}` : "");
    }
    if (actionType === "count_summary") {
        const labels = (newAction.labels && String(newAction.labels).trim()) || "all";
        return `Show counts: ${labels}`;
    }
    if (actionType === "navigate") {
        return `Go to ${urlPathLabel(newAction.page_url)} page`;
    }
    if (actionType === "scroll") {
        const deltaY = newAction.delta_y || 0;
        return `Scroll ${deltaY >= 0 ? "down" : "up"} the page`;
    }
    if (actionType === "screenshot") {
        const shotLabel = (newAction.label || "").trim();
        return shotLabel ? `Take screenshot: ${shotLabel}` : "Take screenshot";
    }
    // extended patterns for the remaining addable types with no natural
    // clicked-element identity of their own (they operate on previously
    // stored counts/lists, or have no locator at all) - same verb + short
    // description + key value shape as the explicit patterns above.
    if (actionType === "capture_value") {
        const storeLabel = (newAction.capture_as || "").trim();
        return `Capture ${label || kind}` + (storeLabel ? ` as ${storeLabel}` : "");
    }
    if (actionType === "compare_value") {
        const against = (newAction.compare_to || "").trim();
        return `Compare captured value` + (against ? ` against ${against}` : "");
    }
    if (actionType === "compare_counts") {
        const a = (newAction.count_a || "").trim();
        const b = (newAction.count_b || "").trim();
        const opWords = { eq: "equals", ne: "does not equal", lt: "is less than",
            lte: "is at most", gt: "is greater than", gte: "is at least" };
        const opWord = opWords[newAction.operator] || "compares to";
        return `Compare ${a || "count A"} ${opWord} ${b || "count B"}`;
    }
    if (actionType === "detect_duplicates") {
        return `Check ${label || kind} for duplicates`;
    }
    if (actionType === "capture_list") {
        const storeLabel = (newAction.capture_as || "").trim();
        return `Capture list from ${label || kind}` + (storeLabel ? ` as ${storeLabel}` : "");
    }
    if (actionType === "compare_list_overlap") {
        const against = (newAction.compare_to || "").trim();
        const storeLabel = (newAction.count_as || "").trim();
        return `Compare list overlap with ${against || "another list"}` + (storeLabel ? ` -> ${storeLabel}` : "");
    }
    if (actionType === "click_if_exists") {
        const target = (newAction.target || "").trim();
        return target ? `Click if present: "${target}"` : "Click if present";
    }
    if (actionType === "tab_switch") {
        const target = (newAction.to_page_id != null) ? newAction.to_page_id : "?";
        return `Switch to tab ${target}`;
    }
    if (actionType === "validate_value_range") {
        const min = (newAction.min_value != null && newAction.min_value !== "") ? newAction.min_value : null;
        const max = (newAction.max_value != null && newAction.max_value !== "") ? newAction.max_value : null;
        const range = (min !== null && max !== null) ? `between ${min} and ${max}`
            : (min !== null) ? `at least ${min}`
            : (max !== null) ? `at most ${max}`
            : "within range";
        return `Validate ${label || kind} is ${range}`;
    }
    // "Any other type" catch-all this task's own spec calls for - never
    // "Click element"-style genericness when there's a real label to show.
    if (label) {
        return `${_readableActionTypeForName(actionType)} '${label}'`;
    }
    return null;
}

function actionTypeLabel(actionType) {
    if (!actionType) {
        return "(unknown step)";
    }
    if (ACTION_TYPE_LABELS[actionType]) {
        return ACTION_TYPE_LABELS[actionType];
    }
    return actionType
        .split("_")
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
}

function renderActions() {

    const container =
        document.getElementById("actionsList");


    container.innerHTML = "";


    const actions =
        Array.isArray(recordingData.actions)
            ? recordingData.actions
            : [];


    if (actions.length === 0) {

        container.innerHTML =
            '<div class="recordings-empty">' +
            'No actions found in this recording.' +
            '</div>';

        return;
    }


    actions.forEach(
        (action, index) => {

            const row =
                document.createElement("div");

            row.className =
                "action-row";


            const header =
                document.createElement("div");

            header.className =
                "action-row-header";


            const title =
                document.createElement("button");

            title.type = "button";

            title.className =
                "action-row-title";

            // FOLLOW-UP FIX (Part 4d, CONFIRMED REAL BUG): an ADDED step's
            // own auto name (buildAutoStepName) always already reads as a
            // full, verb-first sentence ("Select 'Girls' option") - always
            // prefixing the generic action-type label in front of that
            // doubled the verb ("Click - Click element"). A RECORDED
            // step's own deriveActionName() output is NOT reliably verb-
            // first (e.g. a checkbox's "'label' checkbox (state)"), so it
            // keeps today's "TypeLabel - Name" display exactly as before.
            title.textContent = (action.origin === "added")
                ? `${index + 1}. ${deriveActionName(action)}`
                : `${index + 1}. ${actionTypeLabel(action.action_type)} - ${deriveActionName(action)}`;

            title.addEventListener(
                "click",
                () => {
                    details.hidden = !details.hidden;
                }
            );

            const titleGroup =
                document.createElement("div");

            titleGroup.className = "action-row-title-group";

            titleGroup.appendChild(title);

            // PHASE 3c: origin badge - "recorded" (from the recorder,
            // the default for any step with no origin field at all - old
            // recordings included) or "added" (through this editor's own
            // Add Action). Purely informational; never affects replay.
            const originBadge = document.createElement("span");
            const isAdded = action.origin === "added";
            originBadge.className = "origin-badge origin-badge-" + (isAdded ? "added" : "recorded");
            originBadge.textContent = isAdded ? "Added" : "Recorded";
            titleGroup.appendChild(originBadge);

            // locator health badge - from the last Replay's own result
            // for this exact step (see loadLastReplayHealth above), not
            // a fresh analysis of the recording. Omitted entirely (no
            // badge at all) for a step with no locator (navigate,
            // window-level scroll, ...) or one that's never been
            // replayed yet.
            const lastStep = lastReplayStepsByIndex.get(index + 1);
            const healthTierKey = lastStep ? classifyLocatorHealth(lastStep.locator_report) : null;
            if (healthTierKey) {
                const tier = LOCATOR_HEALTH_TIERS[healthTierKey];
                const badge = document.createElement("span");
                badge.className = "locator-health-badge locator-health-" + healthTierKey;
                badge.title = tier.label;
                badge.textContent = tier.icon;
                titleGroup.appendChild(badge);
            }

            header.appendChild(titleGroup);


            const buttons =
                document.createElement("div");

            buttons.className =
                "action-row-buttons";


            const beforeBtn =
                document.createElement("button");

            beforeBtn.type = "button";

            beforeBtn.className = "icon-btn";

            beforeBtn.title = "Add Action Before";

            beforeBtn.textContent = "⬆︎+";

            beforeBtn.addEventListener(
                "click",
                () => openAddActionDialog("before", index)
            );

            buttons.appendChild(beforeBtn);


            const renameBtn =
                document.createElement("button");

            renameBtn.type = "button";

            renameBtn.className = "icon-btn";

            renameBtn.title = "Rename this step";

            renameBtn.textContent = "✎";

            renameBtn.addEventListener(
                "click",
                (evt) => {
                    evt.stopPropagation();
                    const current = (typeof action.name === "string" && action.name.trim())
                        ? action.name
                        : deriveActionName(action);
                    const next = window.prompt("Step name:", current);
                    // null = Cancel; empty string clears back to the
                    // auto-generated name (the SAME deriveActionName()
                    // fallback every unrenamed step already uses) rather
                    // than storing an empty name
                    if (next === null) {
                        return;
                    }
                    const trimmed = next.trim();
                    action.name = trimmed || null;
                    renderActions();
                }
            );

            buttons.appendChild(renameBtn);


            // ITEM 8: lets this EXISTING step's own action type/fields/
            // locator be re-picked/edited in place (see
            // openAddActionDialog's own "edit" mode and modalSaveBtn's
            // matching branch) - previously the only way to change an
            // already-recorded step's target was to delete it and add a
            // brand new one from scratch.
            const editBtn =
                document.createElement("button");

            editBtn.type = "button";

            editBtn.className = "icon-btn";

            editBtn.title = "Edit this step (re-pick element/fields)";

            editBtn.textContent = "⚙";

            editBtn.addEventListener(
                "click",
                (evt) => {
                    evt.stopPropagation();
                    openAddActionDialog("edit", index);
                }
            );

            buttons.appendChild(editBtn);


            const afterBtn =
                document.createElement("button");

            afterBtn.type = "button";

            afterBtn.className = "icon-btn";

            afterBtn.title = "Add Action After";

            afterBtn.textContent = "⬇︎+";

            afterBtn.addEventListener(
                "click",
                () => openAddActionDialog("after", index)
            );

            buttons.appendChild(afterBtn);


            const deleteBtn =
                document.createElement("button");

            deleteBtn.type = "button";

            deleteBtn.className = "icon-btn icon-btn-danger";

            deleteBtn.title = "Delete";

            deleteBtn.textContent = "✕";

            deleteBtn.addEventListener(
                "click",
                () => {
                    if (!confirm("Delete this action?")) {
                        return;
                    }

                    // ITEM 8: capture the action's own data AND its
                    // position before removing it, so Undo can put it
                    // back exactly where it was - not append it at the
                    // end or leave it blank
                    deletedActionsStack.push({
                        index,
                        action: recordingData.actions[index],
                    });
                    updateUndoDeleteBtn();

                    recordingData.actions.splice(index, 1);

                    document.getElementById(
                        "recordingActionCount"
                    ).textContent =
                        recordingData.actions.length;

                    renderActions();
                }
            );

            buttons.appendChild(deleteBtn);


            header.appendChild(buttons);

            row.appendChild(header);


            const details =
                document.createElement("div");

            details.className =
                "action-row-details";

            details.hidden = true;

            const detailRows = DETAIL_FIELD_ORDER
                .filter(([key]) => action[key] !== undefined && action[key] !== null && action[key] !== "")
                .map(([key, label]) => `<div><span class="detail-key">${label}:</span> ${String(action[key])}</div>`)
                .join("");

            const lp = action.locator_profile;

            // locator health detail block - Locator strategy / Resolution
            // / Recommendation, built from the SAME last-Replay
            // locator_report the badge above uses (see
            // loadLastReplayHealth/classifyLocatorHealth). Raw
            // css_path/xpath stay behind "Advanced locator details" -
            // never shown by default (see this feature's own
            // requirement: "Do not expose raw JSON by default").
            const lr = lastStep && lastStep.locator_report;
            let healthBlock = "";
            if (lr) {
                const recommendation = !healthTierKey || healthTierKey === "unresolved"
                    ? "This step's locator could not be resolved last run - consider re-recording it."
                    : (healthTierKey === "stable" || healthTierKey === "fallback")
                        ? "No action required."
                        : "Consider re-recording this step.";
                const resolutionLabel = (lr.fallback_level !== null && lr.fallback_level !== undefined && lr.fallback_level <= 10)
                    ? "Primary locator"
                    : "Fallback locator";
                healthBlock =
                    `<div><span class="detail-key">Locator strategy:</span> ${_escapeHtml(lr.strategy_label || "Unresolved")}</div>` +
                    `<div><span class="detail-key">Resolution:</span> ${_escapeHtml(lr.resolved ? resolutionLabel : "Not resolved")}</div>` +
                    `<div><span class="detail-key">Recommendation:</span> ${_escapeHtml(recommendation)}</div>`;
            }

            const advancedRows = [];
            if (lp && lp.css_path) advancedRows.push(`<div><span class="detail-key">css:</span> ${_escapeHtml(lp.css_path)}</div>`);
            if (lp && lp.xpath) advancedRows.push(`<div><span class="detail-key">xpath:</span> ${_escapeHtml(lp.xpath)}</div>`);
            if (lp && lp.id) advancedRows.push(`<div><span class="detail-key">id:</span> ${_escapeHtml(lp.id)}</div>`);
            if (lr && lr.strategy) advancedRows.push(`<div><span class="detail-key">raw strategy:</span> ${_escapeHtml(lr.strategy)}</div>`);
            const advancedBlock = advancedRows.length
                ? `<details class="advanced-locator-details"><summary>Advanced locator details</summary>${advancedRows.join("")}</details>`
                : "";

            details.innerHTML =
                detailRows + healthBlock + advancedBlock ||
                '<div class="detail-key">No additional details for this step.</div>';

            row.appendChild(details);


            container.appendChild(row);
        }
    );
}


/* =========================================================
   ADD ACTION DIALOG - guided action-type + field entry, with live
   locator validation against the real page before Save is allowed for
   any action type that needs one. Save here only edits the in-memory
   recordingData.actions array (insert-before/after/append) - the
   page-level "Save Edited JSON" button (unchanged, above) is still the
   only thing that calls POST /api/recordings/save.
========================================================= */

const addActionModal = document.getElementById("addActionModal");
const modalTitle = document.getElementById("modalTitle");
const modalActionType = document.getElementById("modalActionType");
const modalActionDescription = document.getElementById("modalActionDescription");
const modalFields = document.getElementById("modalFields");
const modalTestNavigateSection = document.getElementById("modalTestNavigateSection");
const modalTestNavigateBtn = document.getElementById("modalTestNavigateBtn");
const modalTestNavigateResult = document.getElementById("modalTestNavigateResult");
const modalLocatorSection = document.getElementById("modalLocatorSection");
const modalXpath = document.getElementById("modalXpath");
const modalValidateBtn = document.getElementById("modalValidateBtn");
const modalPickElementBtn = document.getElementById("modalPickElementBtn");
const modalValidateResult = document.getElementById("modalValidateResult");
const modalXpathCandidates = document.getElementById("modalXpathCandidates");
const modalOrphanWarning = document.getElementById("modalOrphanWarning");
const modalOrphanWarningText = document.getElementById("modalOrphanWarningText");
const modalOrphanWarningDismiss = document.getElementById("modalOrphanWarningDismiss");
const modalCancelBtn = document.getElementById("modalCancelBtn");
const modalSaveBtn = document.getElementById("modalSaveBtn");

// dismissing the orphaned-assertion warning only suppresses THIS
// instance of it - typing a different xpath or picking a different
// action type re-evaluates and can show it again, so a genuine change
// in what's being checked is never silently hidden
let modalOrphanWarningDismissed = false;

// { mode: "before" | "after" | "append", index: number|null, pageUrl, pageId }
let modalContext = null;

// Minted ONCE per editor page load (not per modal open, not per pick) -
// names this tab's own warm Pick Element browser server-side (see
// recorder/pick_element.py's _WarmPickSession). Every prewarm/start call
// this page ever makes sends the SAME token, so a browser a prewarm
// call already got moving stays reusable across as many Add Action
// modal openings as happen before the tab itself is closed/reloaded.
const pickWarmId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random()));

// Fire-and-forget: gets a background browser moving toward this exact
// insertion point the INSTANT the Add Action modal opens, well before
// the user has clicked Pick Element at all - so that click can often
// find the browser already there instead of waiting through a replay.
// Errors are deliberately swallowed here - a failed/slow prewarm just
// means the eventual Pick Element click falls back to replaying live,
// exactly like before this existed.
function prewarmPickElement() {
    if (!modalContext || !recordingPath) {
        return;
    }
    fetch("/api/recordings/pick_element/prewarm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            warm_id: pickWarmId,
            session_path: recordingPath,
            insert_after_index: modalContext.insertAfterIndex ?? -1,
        }),
    }).catch(() => {});
}

// Closes this tab's own warm picker browser right away instead of
// leaving it open until it times out on its own - called whenever the
// Add Action modal is cancelled, saved, or otherwise closed without the
// user having closed the picker window themselves. Fire-and-forget,
// same as prewarmPickElement above - a failed/slow call here just means
// that browser window lingers a bit longer, exactly like before this
// existed, never something the user needs to see or retry.
function cancelPickElement() {
    fetch("/api/recordings/pick_element/cancel", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ warm_id: pickWarmId }),
    }).catch(() => {});
}

// Distinct, one-line warning shown alongside whatever else the modal is
// displaying whenever the picker's live page URL doesn't match what the
// recording's own preceding steps expect at this exact position (see
// recorder/pick_element.py's _run_pick_wait_phase safety check) - real
// site drift (a redirect, an A/B variant, a login wall) since the
// recording was made, surfaced explicitly rather than silently letting
// a pick happen against the wrong page.
function urlMismatchSuffix(data) {
    const check = data && data.page_url_check;
    if (!check || !check.mismatch) {
        return "";
    }
    return ` ⚠ Page URL doesn't match the recording here (expected ${check.expected_url}, got ${check.actual_url}) - the site may have changed since this was recorded.`;
}

// Distinct, stronger warning than urlMismatchSuffix above: set only when
// the preceding-actions walk didn't just land somewhere unexpected, but
// actually STOPPED PARTWAY because a step's own recorded target was
// confirmed to no longer match the live page (see recorder/
// pick_element.py's _replay_preceding_actions/content_mismatch) - the
// picker is sitting on an EARLIER page than the recording's own
// insertion point, not the one whatever is picked here will actually be
// added after.
function contentMismatchSuffix(data) {
    const mismatch = data && data.content_mismatch;
    if (!mismatch) {
        return "";
    }
    return ` ⚠ Couldn't reach the intended page - step ${mismatch.step_index} (${mismatch.action_type}) no longer matches this site's live content, so replay stopped there instead of guessing further. The browser below is on an EARLIER page than where this action would actually be added - re-record this part of the flow if the site has changed.`;
}

// Steps of the pre-replay (the recorded steps before the insertion point,
// replayed so the picker lands on the right page) that didn't run cleanly -
// listed by step number and reason, so a picker sitting on an unexpected page
// is never left unexplained (see recorder/pick_element.py's
// _replay_preceding_actions/replay_failures). Informational: the replay
// carries on best-effort past these.
function replayFailuresSuffix(data) {
    const failures = data && data.replay_failures;
    if (!failures || failures.length === 0) {
        return "";
    }
    const list = failures
        .map(f => `step ${f.step_index} (${f.action_type}): ${f.reason}`)
        .join("; ");
    return ` ⚠ ${failures.length} earlier step(s) didn't run cleanly while getting here - ${list}. The browser below may not be on the page you expect.`;
}

// true once Validate has come back with the xpath actually resolving
// on the real page - reset to false any time the action type or the
// locator field changes, so a stale "found" result can never be
// carried into a save after an edit
let modalLocatorValidated = false;

function updateModalSaveEnabled() {
    const def = ACTION_FIELD_DEFS[modalActionType.value] || { locator: false };
    let disabled = def.locator && !modalLocatorValidated;
    // FIX 1: block Save for an unusable Validate Value Range range,
    // BEFORE it ever reaches replay - both bounds empty, min > max, or
    // either bound not a plain number.
    if (modalActionType.value === "validate_value_range") {
        const vrError = validateValueRangeBounds();
        const errEl = document.getElementById("modalValueRangeError");
        if (errEl) {
            errEl.textContent = vrError || "";
            errEl.style.display = vrError ? "block" : "none";
        }
        if (vrError) disabled = true;
    }
    modalSaveBtn.disabled = disabled;
}

// FIX 1: returns a plain-English reason the current min/max fields can't
// be saved, or "" when they're fine. Pure/read-only - never mutates
// anything, so it's safe to call on every keystroke.
function validateValueRangeBounds() {
    const minEl = document.getElementById("modalField_min_value");
    const maxEl = document.getElementById("modalField_max_value");
    if (!minEl || !maxEl) return "";
    const minRaw = minEl.value.trim();
    const maxRaw = maxEl.value.trim();
    if (!minRaw && !maxRaw) {
        return "Set at least one of Minimum value / Maximum value.";
    }
    if (minRaw && isNaN(Number(minRaw))) {
        return "Minimum value must be a number.";
    }
    if (maxRaw && isNaN(Number(maxRaw))) {
        return "Maximum value must be a number.";
    }
    if (minRaw && maxRaw && Number(minRaw) > Number(maxRaw)) {
        return "Minimum value can't be greater than Maximum value.";
    }
    return "";
}

// COUNT ELEMENTS VALIDATION - the most recent live match count seen for
// the CURRENT xpath, from either a pick or a Validate click; null until
// either has actually run once for this modal session. Only ever read
// for action_type === "count_elements" (countElementsWarnings' own first
// check), irrelevant/unused for every other action type.
let lastCountElementsMatchCount = null;

// FOLLOW-UP FIX (Part 4): the most recent PICK's own element_label/
// element_kind/element_section (see action_capture.js's own
// _afqaComputeElementLabelInfo) - null until a pick actually completes
// for this modal session (a manually-typed XPath, with no pick at all,
// never sets this; buildAutoStepName falls back to reading the xpath's
// own text()/normalize-space() predicate for that case instead - see
// its own docstring). Saved onto newAction.locator_profile at Save time
// (modalSaveBtn) so a LATER edit of this same step, without a fresh
// re-pick, still has it to build/keep the step's name from.
let lastPickedLabelInfo = null;

// returns the warning strings that currently apply (b: Expected Count
// filled and different from matchCount; c: matchCount is exactly 1) -
// used both to render them inline and, unchanged, to build the Save
// confirm() dialog's own message, so what the user sees before saving is
// always exactly what they were already shown.
function countElementsWarnings(matchCount) {
    if (modalActionType.value !== "count_elements") return [];
    if (typeof matchCount !== "number" || matchCount < 0) return [];
    const warnings = [];
    const expectedInput = document.getElementById("modalField_expected_count");
    const expectedRaw = expectedInput ? expectedInput.value.trim() : "";
    if (expectedRaw !== "" && Number(expectedRaw) !== matchCount) {
        warnings.push(`Heads up: you expect ${expectedRaw}, but this XPath matches ${matchCount} right now.`);
    }
    if (matchCount === 1) {
        warnings.push("This XPath matches only one element. To count many, drag over at least two similar items.");
    }
    return warnings;
}

// appends (or, on a repeat call, cleanly replaces) the amber warning
// lines under modalValidateResult's own main message - never touches
// that main message itself (set separately, just before this is called,
// by whichever of Pick/Validate/the Expected Count field's own input
// listener - see renderModalFields - triggered this).
function appendCountElementsWarnings(matchCount) {
    lastCountElementsMatchCount = matchCount;
    const existing = document.getElementById("countElementsWarnings");
    if (existing) existing.remove();
    const warnings = countElementsWarnings(matchCount);
    if (!warnings.length) return;
    const container = document.createElement("div");
    container.id = "countElementsWarnings";
    warnings.forEach(w => {
        const line = document.createElement("div");
        line.className = "locator-status-warn";
        line.textContent = w;
        container.appendChild(line);
    });
    modalValidateResult.hidden = false;
    modalValidateResult.appendChild(container);
}

/* =========================================================
   ORPHANED-ASSERTION WARNING (Layer 3) - purely structural XPath
   comparison, no element names/site domains/session-specific rules of
   any kind. Works identically on any site: two xpaths are "related"
   when they're identical, or when they share a DISTINCTIVE identity
   signal - a text-content literal (contains(text(), '...') /
   contains(., '...'), the same predicate shapes this project's own
   xPath() capture logic already generates for a readable label) or an
   @id value. Both are generically specific to ONE element or its
   close container on any site. A bare structural attribute like
   @role='checkbox' is deliberately NOT used as a signal on its own -
   dozens of unrelated elements on the same page (every checkbox in a
   filter list, say) legitimately share it, so matching on it alone
   would call almost every read-only checkbox action "related" to
   every click, defeating the whole point of this warning.
========================================================= */

function extractXPathTokens(xpath) {
    if (!xpath) {
        return [];
    }
    const tokens = new Set();

    const textLiterals = xpath.match(/contains\(\s*(?:text\(\)|\.)\s*,\s*(?:'[^']*'|"[^"]*")\s*\)/g) || [];
    textLiterals.forEach(seg => tokens.add(seg.trim().toLowerCase()));

    // FIX 4: the SAME text literal anchored with an EXACT match
    // (normalize-space(text())='...' / normalize-space(.)='...' - what
    // xPath()'s own exact-match tiers produce, see action_capture.js) was
    // never recognized here at all, only the contains() shape above - two
    // steps that both target the SAME label by its exact visible text (one
    // via Click Checkbox's own recorded xpath, one via a Pick Element'd
    // exact-text xpath) shared no token in common, so the "no earlier step
    // sets up this element's state" warning fired even though one plainly
    // did. Recognized here, AND the bare literal itself pulled out of BOTH
    // this and the contains() match above (additive - the existing full-
    // segment tokens stay exactly as they were) - two steps anchored on the
    // identical visible text now share that one token regardless of which
    // of the two XPath functions wrapped it.
    const exactTextLiterals = xpath.match(/normalize-space\(\s*(?:text\(\)|\.)\s*\)\s*=\s*(?:'[^']*'|"[^"]*")/g) || [];
    exactTextLiterals.forEach(seg => tokens.add(seg.trim().toLowerCase()));
    [...textLiterals, ...exactTextLiterals].forEach(seg => {
        const lit = (seg.match(/'[^']*'|"[^"]*"/) || [])[0];
        if (lit) tokens.add(lit.trim().toLowerCase());
    });

    const idLiterals = xpath.match(/@id\s*=\s*(?:'[^']*'|"[^"]*")/g) || [];
    idLiterals.forEach(seg => tokens.add(seg.trim().toLowerCase()));

    const idPrefixLiterals = xpath.match(/starts-with\(\s*@id\s*,\s*(?:'[^']*'|"[^"]*")\s*\)/g) || [];
    idPrefixLiterals.forEach(seg => tokens.add(seg.trim().toLowerCase()));

    return Array.from(tokens);
}

function xpathsAreRelated(xpathA, xpathB) {
    if (!xpathA || !xpathB) {
        return false;
    }
    const a = xpathA.trim();
    const b = xpathB.trim();
    if (a === b) {
        return true;
    }
    const tokensA = extractXPathTokens(a);
    const tokensB = new Set(extractXPathTokens(b));
    return tokensA.some(t => tokensB.has(t));
}

// preceding actions = the real, already-recorded actions this new one
// is being inserted after - same slice validate_locator's own backend
// derivation uses (see modalContext.insertAfterIndex)
function precedingActionsForWarning() {
    if (!modalContext || !recordingData || !Array.isArray(recordingData.actions)) {
        return [];
    }
    const actions = recordingData.actions;
    const endIdx = Math.max(0, Math.min((modalContext.insertAfterIndex ?? -1) + 1, actions.length));
    return actions.slice(0, endIdx);
}

function relatedPrecedingActionExists(candidateXpath) {
    const preceding = precedingActionsForWarning();
    return preceding.some(action => {
        const priorXpath = (action.locator_profile || {}).xpath;
        return xpathsAreRelated(candidateXpath, priorXpath);
    });
}

function updateOrphanWarning() {
    const def = ACTION_FIELD_DEFS[modalActionType.value] || {};
    const xpath = modalXpath.value.trim();

    const shouldWarn = Boolean(def.readOnly) && xpath !== "" && !relatedPrecedingActionExists(xpath);

    if (shouldWarn && !modalOrphanWarningDismissed) {
        modalOrphanWarningText.textContent =
            "This step only checks state - it doesn't interact with the page. No earlier step " +
            "in this session appears to set up this element's state. If you intended to click/set " +
            "it first, add that action before this one.";
        modalOrphanWarning.hidden = false;
    } else {
        modalOrphanWarning.hidden = true;
    }
}

modalOrphanWarningDismiss.addEventListener("click", () => {
    modalOrphanWarningDismissed = true;
    modalOrphanWarning.hidden = true;
});

function renderModalFields() {

    const actionType = modalActionType.value;
    const def = ACTION_FIELD_DEFS[actionType] || { locator: false, fields: [] };

    modalFields.innerHTML = "";

    def.fields.forEach(field => {

        const label = document.createElement("label");
        label.textContent = field.label;
        modalFields.appendChild(label);

        let input;
        if (field.type === "select") {
            input = document.createElement("select");
            input.className = "editor-input";
            field.options.forEach(([optValue, optLabel]) => {
                const opt = document.createElement("option");
                opt.value = optValue;
                opt.textContent = optLabel;
                input.appendChild(opt);
            });
        } else {
            input = document.createElement("input");
            input.type = field.type === "number" ? "number" : "text";
            input.className = "editor-input";
            if (field.placeholder) {
                input.placeholder = field.placeholder;
            }
        }
        input.dataset.fieldKey = field.key;
        input.id = "modalField_" + field.key;
        modalFields.appendChild(input);
    });

    // FIX 1: min/max bounds check, live as the user types - inline error
    // message plus Save disabled while it's set (see
    // validateValueRangeBounds/updateModalSaveEnabled above).
    if (actionType === "validate_value_range") {
        const vrError = document.createElement("div");
        vrError.id = "modalValueRangeError";
        vrError.className = "locator-status-fail";
        vrError.style.display = "none";
        modalFields.appendChild(vrError);
        ["min_value", "max_value"].forEach(key => {
            const input = document.getElementById("modalField_" + key);
            if (input) input.addEventListener("input", updateModalSaveEnabled);
        });
        // FIX 1 (item 3b): choosing a value_hint re-runs Validate so its
        // effect on ambiguous items is visible immediately, without a
        // separate confirm step.
        const hintSelect = document.getElementById("modalField_value_hint");
        if (hintSelect) {
            hintSelect.addEventListener("change", () => {
                if (modalXpath.value.trim()) modalValidateBtn.click();
            });
        }
    }

    // FOLLOW-UP FIX (Part 3c): clickable suggestions for the labels
    // already stored by a Count Elements step earlier in THIS recording -
    // the user picks instead of typing (and risking a typo that silently
    // matches nothing - see Part 3a's own missing-label warning for what
    // happens today when that happens). Reads recordingData.actions
    // directly - no new state, nothing saved until the user actually
    // clicks one or types their own.
    if (actionType === "count_summary") {
        const savedLabels = [];
        (recordingData.actions || []).forEach(a => {
            const label = a.action_type === "count_elements" && (a.count_as || "").trim();
            if (label && savedLabels.indexOf(label) === -1) {
                savedLabels.push(label);
            }
        });
        if (savedLabels.length) {
            const suggestWrap = document.createElement("div");
            suggestWrap.id = "countSummaryLabelSuggestions";
            suggestWrap.className = "modal-helper-text";
            const heading = document.createElement("div");
            heading.textContent = "Saved counts in this recording (click to add):";
            suggestWrap.appendChild(heading);
            const chipsRow = document.createElement("div");
            chipsRow.className = "label-suggestion-chips";
            savedLabels.forEach(label => {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "secondary-btn label-suggestion-chip";
                chip.textContent = label;
                chip.addEventListener("click", () => {
                    const labelsInput = document.getElementById("modalField_labels");
                    if (!labelsInput) return;
                    const current = labelsInput.value.split(",").map(l => l.trim()).filter(Boolean);
                    if (current.indexOf(label) === -1) {
                        current.push(label);
                        labelsInput.value = current.join(", ");
                    }
                });
                chipsRow.appendChild(chip);
            });
            suggestWrap.appendChild(chipsRow);
            modalFields.appendChild(suggestWrap);
        }
    }

    // COUNT ELEMENTS VALIDATION: re-check live as the user edits Expected
    // Count itself, not just right after a fresh Pick/Validate - lets
    // "set it to a wrong number" show the amber warning immediately.
    // lastCountElementsMatchCount is reset below (this is a brand new
    // field, and a stale match count from a DIFFERENT xpath/action type
    // must never leak into it) - this listener then only ever has
    // anything to show once a real Pick/Validate has run for THIS field.
    if (actionType === "count_elements") {
        const expectedInput = document.getElementById("modalField_expected_count");
        if (expectedInput) {
            expectedInput.addEventListener("input", () => {
                if (lastCountElementsMatchCount !== null) {
                    appendCountElementsWarnings(lastCountElementsMatchCount);
                }
            });
        }
    }

    modalActionDescription.textContent = def.description || "";

    modalLocatorSection.hidden = !def.locator;
    modalXpath.value = "";
    modalValidateResult.hidden = true;
    modalLocatorValidated = false;
    lastCountElementsMatchCount = null;
    lastPickedLabelInfo = null;
    modalOrphanWarningDismissed = false;
    updateOrphanWarning();
    updateModalSaveEnabled();

    // ITEM 3: "Test Navigate" is only meaningful for the navigate
    // action type itself (locator: false, so modalLocatorSection above
    // is always hidden for it) - shown/reset here, in the one place
    // this modal already resets per-action-type UI state on every
    // action-type change.
    modalTestNavigateSection.hidden = (actionType !== "navigate");
    modalTestNavigateResult.hidden = true;
}

function populateActionTypeDropdown(keepActionType) {
    modalActionType.innerHTML = "";
    Object.keys(ACTION_FIELD_DEFS).forEach(actionType => {
        // hiddenFromAddMenu (see check_checked's own entry above): this
        // action type still fully works for a step that already has it
        // (every other ACTION_FIELD_DEFS lookup in this file is keyed by
        // the STEP's own action_type, never by what's offered here) -
        // only excluded from the choices offered for a NEW step.
        // keepActionType: editing an EXISTING step of a hidden type still
        // has to offer that step's own type (see openAddActionDialog's
        // "edit" branch), otherwise the select goes blank
        if (ACTION_FIELD_DEFS[actionType].hiddenFromAddMenu && actionType !== keepActionType) {
            return;
        }
        const opt = document.createElement("option");
        opt.value = actionType;
        opt.textContent = actionTypeLabel(actionType);
        modalActionType.appendChild(opt);
    });
}

populateActionTypeDropdown();

modalActionType.addEventListener("change", renderModalFields);

modalXpath.addEventListener("input", () => {
    modalLocatorValidated = false;
    modalValidateResult.hidden = true;
    modalOrphanWarningDismissed = false;
    updateOrphanWarning();
    updateModalSaveEnabled();
});

// ITEM 3: actually performs the navigation a "navigate" step's own
// Target URL field describes, in a real (self-contained, one-shot)
// browser - see /api/recordings/test_navigate's own docstring for why
// this can never affect how any OTHER step in this recording resolves:
// it never touches session_path/preceding_actions/recordingData, and
// its browser is always closed again before the response comes back,
// so there's nothing left open or left behind for a later Pick Element
// click (or a real Replay, which always launches its own fresh browser
// regardless) to collide with.
modalTestNavigateBtn.addEventListener("click", async () => {
    const urlInput = document.getElementById("modalField_page_url");
    const url = urlInput ? urlInput.value.trim() : "";

    if (!url) {
        modalTestNavigateResult.className = "locator-status-fail";
        modalTestNavigateResult.textContent = "Enter a URL first.";
        modalTestNavigateResult.hidden = false;
        return;
    }

    modalTestNavigateBtn.disabled = true;
    modalTestNavigateResult.className = "editor-message";
    modalTestNavigateResult.textContent = "Opening a browser window and navigating there for real...";
    modalTestNavigateResult.hidden = false;

    try {
        const response = await fetch("/api/recordings/test_navigate", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ url }),
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Couldn't test that URL.");
        }

        modalTestNavigateResult.className = "locator-status-ok";
        modalTestNavigateResult.textContent = data.message || "Navigation succeeded.";
        modalTestNavigateResult.hidden = false;
    } catch (error) {
        modalTestNavigateResult.className = "locator-status-fail";
        modalTestNavigateResult.textContent = "Test Navigate failed: " + error.message;
        modalTestNavigateResult.hidden = false;
    } finally {
        modalTestNavigateBtn.disabled = false;
    }
});

modalValidateBtn.addEventListener("click", async () => {

    const xpath = modalXpath.value.trim();

    if (!xpath) {
        modalValidateResult.className = "editor-error";
        modalValidateResult.textContent = "Enter an XPath first.";
        modalValidateResult.hidden = false;
        return;
    }

    modalValidateBtn.disabled = true;
    modalValidateResult.className = "editor-message";
    modalValidateResult.textContent = "Validating...";
    modalValidateResult.hidden = false;

    try {

        const response = await fetch("/api/recordings/validate_locator", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
                session_path: recordingPath,
                insert_after_index: (modalContext && modalContext.insertAfterIndex) ?? -1,
                xpath: xpath,
                action_type: modalActionType.value,
                value_hint: modalActionType.value === "validate_value_range"
                    ? (document.getElementById("modalField_value_hint") || {}).value || null
                    : null,
            }),
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Validation failed.");
        }

        modalLocatorValidated = Boolean(data.found);

        const matchCount = data.match_count ?? 0;
        modalValidateResult.className = modalLocatorValidated ? "locator-status-ok" : "locator-status-fail";
        // COUNT ELEMENTS VALIDATION (e): a plain count is what matters
        // here, not a found/not-found framing (0 is a perfectly valid
        // thing to count) - same wording action_capture.js's own multi-
        // pick result already uses, just without the "inside your
        // selection" half (Validate has no selection at all).
        modalValidateResult.textContent = (modalActionType.value === "count_elements")
            ? `Found: ${matchCount} matching elements`
            : (modalLocatorValidated
                ? `✓ Found (${matchCount} match${matchCount === 1 ? "" : "es"})`
                : `✗ Not found (${matchCount} match${matchCount === 1 ? "" : "es"})`);
        // COUNT ELEMENTS VALIDATION (b, c): same amber warnings a pick
        // already shows, kept in sync after a manual Validate too.
        appendCountElementsWarnings(matchCount);

        // FIX 3: for a checkbox validation, "found" alone doesn't tell the
        // user what they actually need to know before saving - the REAL
        // current state, read the same way a real replay would (see
        // app.py's own checkbox_state_info, computed via the shared
        // _resolve_checkbox_state helper).
        if (modalActionType.value === "validate_checked" && data.checkbox_state_info) {
            const cbInfo = data.checkbox_state_info;
            const stateLine = document.createElement("div");
            if (cbInfo.state === "not_a_checkbox") {
                stateLine.className = "locator-status-fail";
                stateLine.textContent = cbInfo.resolvedHow === "ambiguous"
                    ? `⚠ Ambiguous: ${cbInfo.ambiguousCount} checkboxes found near this element.`
                    : `⚠ This isn't a checkbox, and no single associated checkbox was found nearby.`;
            } else {
                const via = ["label.control", "descendant", "ancestor"].includes(cbInfo.resolvedHow)
                    ? ` (resolved via ${cbInfo.resolvedHow} from <${cbInfo.resolvedTag}>)` : "";
                stateLine.className = "editor-message";
                stateLine.textContent = `Current state: ${cbInfo.state}${via}`;
            }
            modalValidateResult.appendChild(document.createElement("br"));
            modalValidateResult.appendChild(stateLine);
        }

        // BUG 2 fix (f): preview the value(s) Validate Value Range WILL
        // check, computed server-side by the exact same resolver a real
        // replay uses (app.py's own value_range_preview) - lets the user
        // catch an ambiguous pick and fix it before saving.
        if (modalActionType.value === "validate_value_range" && Array.isArray(data.value_range_preview)) {
            appendValueRangePreview(data.value_range_preview);
        }

        modalValidateResult.hidden = false;

    } catch (error) {

        modalLocatorValidated = false;
        modalValidateResult.className = "locator-status-fail";
        modalValidateResult.textContent = "Validation failed: " + error.message;
        modalValidateResult.hidden = false;

    } finally {
        modalValidateBtn.disabled = false;
        updateModalSaveEnabled();
    }
});

// BUG 2 fix (f): shared by the Validate button handler and the pick-result
// handler below - "Values found: ..." when every matched element resolved
// cleanly, plus an amber note naming how many are ambiguous otherwise
// (never blocks saving; purely informational, same convention as the
// Count Elements/drag-select amber notes elsewhere in this file).
