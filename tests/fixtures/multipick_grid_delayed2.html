<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; }
  #grid { padding: 20px; overflow: hidden; }
  .product-base { box-sizing: border-box; display: block; float: left; width: 180px; height: 140px;
                   margin: 8px; border: 1px solid #ccc; padding: 6px; }
</style>
</head>
<body>
  <button id="loadBtn">Load results</button>
  <div id="grid"></div>
  <script>
    document.getElementById('loadBtn').addEventListener('click', function () {
      // simulates a click that kicks off an async fetch/render - the
      // list is NOT there yet the instant the click handler runs
      setTimeout(function () {
        var grid = document.getElementById('grid');
        for (var i = 1; i <= 40; i++) {
          var card = document.createElement('div');
          card.className = 'product-base card-render-' + (100000 + i);
          grid.appendChild(card);
        }
      }, 2000);
    });
  </script>
</body>
</html>
