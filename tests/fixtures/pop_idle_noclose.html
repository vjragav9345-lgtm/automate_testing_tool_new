<!doctype html><html><head><title>popup without close</title></head><body style="margin:0">
<div id="pop" style="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:9999"></div>
<script>document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.getElementById('pop'))document.getElementById('pop').remove();});</script></body></html>
