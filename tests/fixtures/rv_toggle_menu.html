<!doctype html><html><head><title>toggle menu</title><style>
body{margin:0;font:14px sans-serif} #bar{background:#ddd;padding:10px;height:30px;position:relative}
#menu{display:none;position:absolute;top:44px;left:10px;width:200px;background:#eef;padding:8px;z-index:5}
#menu.open{display:block} #menu a{display:block;padding:5px 0}
</style></head><body><div id="bar" onmouseleave="document.getElementById('menu').classList.remove('open')">
<a href="#" id="trg" aria-haspopup="true">Products</a>
<div id="menu"><a href="hov_menu_target.html?p=1" id="item">Pro Analytics</a><a href="hov_footer.html">Other</a></div></div>
<script>
var t=document.getElementById('trg'),m=document.getElementById('menu');
t.addEventListener('mouseenter',function(){m.classList.add('open');});
t.addEventListener('click',function(e){e.preventDefault();m.classList.toggle('open');});
</script></body></html>
