<!doctype html><html><body><div id="dlg" role="dialog" style="position:fixed;left:50px;top:50px;width:600px;height:400px;background:#ccc;z-index:50"><p>Overlay without a close button</p></div>
<script>document.addEventListener('keydown',function(e){if(e.key==='Escape'){var d=document.getElementById('dlg');if(d)d.remove();}});</script></body></html>
