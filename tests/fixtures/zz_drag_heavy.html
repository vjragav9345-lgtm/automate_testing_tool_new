<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: 10px; }
  .grid { position: relative; width: 250px; height: 3240px; }
  .product-card { position: absolute; left: 0; width: 250px; height: 54px; border: 1px solid #999; box-sizing: border-box; padding: 4px; font-family: sans-serif; font-size: 12px; }
  .noise { position: fixed; top: -99999px; left: -99999px; width: 4px; height: 4px; }
</style>
</head>
<body>
  <h2>Products (heavy page)</h2>
  <div id="noise"></div>
  <div class="grid" id="grid"></div>
  <script>
    // simulate a real, DOM-heavy production page (headers, ads, filter
    // widgets, analytics markup, nested wrapper divs) so the drag-select
    // candidate scan runs against thousands of elements, not the ~60
    // elements a minimal test fixture has.
    var noise = document.getElementById('noise');
    var NOISE_COUNT = 6000;
    var frag = document.createDocumentFragment();
    for (var n = 0; n < NOISE_COUNT; n++) {
      var span = document.createElement('span');
      span.className = 'noise';
      span.textContent = '.';
      frag.appendChild(span);
    }
    noise.appendChild(frag);

    var grid = document.getElementById('grid');
    var TOTAL = 60;
    var ITEM_HEIGHT = 54;
    for (var i = 1; i <= TOTAL; i++) {
      var card = document.createElement('div');
      card.className = 'product-card';
      card.dataset.itemIndex = i;
      card.style.top = ((i - 1) * ITEM_HEIGHT) + 'px';
      card.textContent = 'Item ' + i;
      grid.appendChild(card);
    }
  </script>
</body></html>
